<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VORANIX Overlay - Horizontal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
    --morado:#7b2cff; --morado-light:#9d5bff; --naranja:#ff6a00; --naranja-light:#ff8c33;
    --text:#ffffff; --grad:linear-gradient(90deg, var(--morado) 0%, var(--naranja) 100%);
    --glow-morado:rgba(123,44,255,.55); --glow-naranja:rgba(255,106,0,.4);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ width:1920px; height:1080px; background:transparent; overflow:hidden; }
body{ font-family:"Orbitron",sans-serif; color:var(--text); }
.hidden{ display:none !important; }

/* Sin panel de fondo: los elementos flotan directo sobre el video, con
   sombra propia para mantenerse legibles sobre cualquier imagen de fondo. */
.bar{
    position:absolute; left:0; right:0; bottom:0; height:170px;
    display:flex; align-items:center; gap:32px; padding:0 44px 0 260px;
}
/* El logo se sacó de la barra para poder moverlo de forma independiente
   (editor de layout del Portal Creadores); la barra le deja el mismo
   espacio de siempre (padding-left) para que, sin un layout personalizado
   guardado, se vea idéntica a como era antes. */
#logo-block{ position:absolute; left:44px; top:920px; z-index:5; }
/* La línea de acento solo se ve mientras el ticker está en pantalla
   (ver .show-line, activado desde overlay.js junto con el ticker). */
.bar::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--grad); box-shadow:0 0 16px 2px var(--glow-morado), 0 0 26px 4px var(--glow-naranja);
    opacity:0; transition:opacity .4s ease;
}
.bar.show-line::before{ opacity:1; }

.logo-wrap{ position:relative; width:150px; height:150px; flex-shrink:0; display:flex; align-items:center; justify-content:center; filter:drop-shadow(0 4px 14px rgba(0,0,0,.6)); }
.logo-ring{
    position:absolute; inset:0; border-radius:50%; border:4px solid rgba(255,255,255,.1);
    border-top-color:var(--morado); border-right-color:var(--naranja); animation:spin 2.2s linear infinite;
}
.logo{ width:108px; height:108px; object-fit:contain; border-radius:50%; }

.ticker-wrap{
    flex:1; min-width:0; height:100%; display:flex; align-items:center; overflow:hidden; position:relative;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 70px, #000 calc(100% - 70px), transparent);
    mask-image:linear-gradient(90deg, transparent, #000 70px, #000 calc(100% - 70px), transparent);
}
.ticker{
    display:inline-block; white-space:nowrap; font-size:28px; letter-spacing:1.2px; font-weight:700;
    text-shadow:0 2px 6px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.85);
    opacity:0; transition:opacity .4s ease;
}
.ticker.show{ opacity:1; }
.ticker.scroll{ padding-left:100%; animation:marquee linear infinite; }
@keyframes marquee{ from{ transform:translateX(0); } to{ transform:translateX(-100%); } }
@keyframes spin{ to{ transform:rotate(360deg); } }

.timer{ display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; min-width:190px; }
.timer-label{ font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--naranja-light); font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.9); }
.timer-value{ font-size:33px; font-weight:800; letter-spacing:3px; text-shadow:0 0 16px var(--glow-morado), 0 2px 8px rgba(0,0,0,.9); font-variant-numeric:tabular-nums; }

.sponsor{
    height:120px; min-width:170px; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;
}
.sponsor img{
    max-height:110px; max-width:190px; object-fit:contain; position:absolute; opacity:0; transition:opacity .5s ease;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.7));
}
.sponsor img.show{ opacity:1; }

.codigo-box{ height:120px; min-width:210px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.codigo-chip{
    display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;
    opacity:0; transform:translateY(8px); transition:opacity .5s ease, transform .5s ease;
}
.codigo-chip.show{ opacity:1; transform:translateY(0); }
.codigo-chip-img{ max-height:52px; max-width:150px; object-fit:contain; filter:drop-shadow(0 4px 10px rgba(0,0,0,.7)); }
.codigo-chip-img.hidden{ display:none; }
.codigo-code{ font-size:20px; font-weight:800; letter-spacing:1.5px; text-shadow:0 2px 8px rgba(0,0,0,.9); color:var(--naranja-light); }
.codigo-desc{ font-size:12px; font-weight:600; opacity:.85; text-shadow:0 2px 6px rgba(0,0,0,.9); max-width:190px; }

/* Cartel de redes: entra deslizando desde la derecha, se queda un rato y
   se retira por el mismo lado. */
.social-popup{
    position:absolute; top:64px; right:44px; z-index:10;
    display:flex; align-items:center; gap:16px;
    background:rgba(10,10,16,.6); border:1px solid rgba(255,255,255,.14); border-radius:18px;
    padding:16px 26px; filter:drop-shadow(0 8px 24px rgba(0,0,0,.55));
    transform:translateX(140%); opacity:0; transition:transform .6s cubic-bezier(.16,1,.3,1), opacity .4s ease;
}
.social-popup.show{ transform:translateX(0); opacity:1; }
.social-popup-mono{
    width:50px; height:50px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; color:#fff;
}
.social-popup-text{ display:flex; flex-direction:column; gap:2px; }
.social-popup-platform{ font-size:12px; letter-spacing:2.5px; text-transform:uppercase; color:var(--naranja-light); font-weight:700; }
.social-popup-handle{ font-size:21px; font-weight:700; }

/* Banner de raid: entra con un "pop" celebratorio en el centro-arriba y se
   retira igual de golpe. Solo se activa con ?canal= en la URL. */
.raid-banner{
    position:absolute; top:90px; left:50%; z-index:20;
    display:flex; align-items:center; gap:28px;
    background:rgba(10,10,16,.68); border:2px solid var(--morado); border-radius:24px;
    padding:24px 44px;
    box-shadow:0 0 24px 4px var(--glow-morado), 0 0 42px 10px var(--glow-naranja), 0 12px 30px rgba(0,0,0,.6);
    transform:translate(-50%, -30px) scale(.85); opacity:0;
    transition:transform .55s cubic-bezier(.34,1.56,.64,1), opacity .4s ease;
}
.raid-banner.show{ transform:translate(-50%, 0) scale(1); opacity:1; }
.raid-banner-logo{ width:104px; height:104px; }
.raid-banner-logo .logo{ width:74px; height:74px; }
.raid-banner-text{ display:flex; flex-direction:column; gap:5px; }
.raid-banner-title{ font-size:16px; letter-spacing:2.5px; text-transform:uppercase; color:var(--naranja-light); font-weight:800; }
.raid-banner-name{ font-size:38px; font-weight:800; text-shadow:0 0 18px var(--glow-morado); }
.raid-banner-viewers{ font-size:18px; font-weight:600; opacity:.9; }

/* Banner de comando "estilo noticiero": entra deslizando desde la
   izquierda (mismo lenguaje que el popup de redes, pero del lado opuesto
   para balancear la pantalla), con un acento de color + titular + detalle,
   como un lower-third de noticias. */
.comando-banner{
    position:absolute; top:64px; left:44px; z-index:15;
    display:flex; align-items:stretch; max-width:620px;
    background:rgba(10,10,16,.6); border:1px solid rgba(255,255,255,.14); border-radius:14px;
    overflow:hidden; filter:drop-shadow(0 8px 24px rgba(0,0,0,.55));
    transform:translateX(-140%); opacity:0; transition:transform .6s cubic-bezier(.16,1,.3,1), opacity .4s ease;
}
.comando-banner.show{ transform:translateX(0); opacity:1; }
.comando-banner-bar{ width:8px; flex-shrink:0; background:var(--morado); }
.comando-banner-content{ display:flex; align-items:center; gap:16px; padding:16px 26px; min-width:0; }
.comando-banner-img{ width:60px; height:60px; object-fit:contain; border-radius:8px; flex-shrink:0; }
.comando-banner-img.hidden{ display:none; }
.comando-banner-text{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.comando-banner-tag{ font-size:11px; letter-spacing:2.5px; text-transform:uppercase; font-weight:800; color:var(--naranja-light); }
.comando-banner-title{ font-size:24px; font-weight:800; line-height:1.15; }
.comando-banner-detail{ font-size:15px; font-weight:500; opacity:.88; }
.comando-banner-detail.hidden{ display:none; }
</style>
</head>
<body>

<div id="logo-block">
    <div class="logo-wrap">
        <div class="logo-ring"></div>
        <img id="overlay-logo" class="logo" alt="VORANIX">
    </div>
</div>

<div class="bar">
    <div class="ticker-wrap">
        <div id="overlay-ticker" class="ticker hidden"></div>
    </div>
    <div id="overlay-timer" class="timer hidden">
        <span id="overlay-timer-label" class="timer-label"></span>
        <span id="overlay-timer-value" class="timer-value"></span>
    </div>
    <div id="overlay-sponsors" class="sponsor hidden">
        <img id="overlay-sponsor-logo-a" class="sponsor-img" alt="Sponsor">
        <img id="overlay-sponsor-logo-b" class="sponsor-img" alt="Sponsor">
    </div>
    <div id="overlay-codigos" class="codigo-box hidden">
        <div id="overlay-codigo-chip" class="codigo-chip">
            <img id="overlay-codigo-img" class="codigo-chip-img hidden" alt="">
            <span id="overlay-codigo-code" class="codigo-code"></span>
            <span id="overlay-codigo-desc" class="codigo-desc"></span>
        </div>
    </div>
</div>

<div id="comando-banner" class="comando-banner">
    <span id="comando-banner-bar" class="comando-banner-bar"></span>
    <div class="comando-banner-content">
        <img id="comando-banner-img" class="comando-banner-img hidden" alt="">
        <div class="comando-banner-text">
            <span class="comando-banner-tag">VORANIX</span>
            <span id="comando-banner-title" class="comando-banner-title"></span>
            <span id="comando-banner-detail" class="comando-banner-detail"></span>
        </div>
    </div>
</div>

<div id="social-popup" class="social-popup">
    <div class="social-popup-mono"></div>
    <div class="social-popup-text">
        <span class="social-popup-platform"></span>
        <span class="social-popup-handle"></span>
    </div>
</div>

<div id="raid-banner" class="raid-banner">
    <div class="logo-wrap raid-banner-logo">
        <div class="logo-ring"></div>
        <img src="/imagenes/logopng.png" class="logo" alt="VORANIX">
    </div>
    <div class="raid-banner-text">
        <span class="raid-banner-title">¡Gracias por el raid!</span>
        <span class="raid-banner-name" id="raid-banner-name"></span>
        <span class="raid-banner-viewers" id="raid-banner-viewers"></span>
    </div>
</div>

<script type="module">
    import { initOverlay, initSocialPopup, initRaidAlert, initOverlayEvento, initCustomLayout } from "/assets/js/overlay.js";
    initOverlay();
    initSocialPopup();
    initRaidAlert();
    initOverlayEvento();
    initCustomLayout("horizontal");
</script>
</body>
</html>
