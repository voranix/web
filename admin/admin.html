<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin VORANIX</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --morado:#7b2cff; --naranja:#ff6a00; --bg:#0a0a0f; --sidebar:#0d0d18; --card:#111122; --text:#ffffff; --muted:#a9a9bc; --danger:#ff3b5c; --ok:#00c853; }
*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ min-height:100%; overflow-x:hidden; }
body{ min-height:100vh; background:var(--bg); color:var(--text); font-family:"Orbitron",sans-serif; }
img, iframe{ max-width:100%; display:block; }
button,input,textarea,select{ font:inherit; max-width:100%; }
button{ cursor:pointer; }
.hidden{ display:none !important; }
.login-screen{ min-height:100vh; display:grid; place-items:center; padding:24px; }
.login-card{ width:min(420px,100%); background:var(--card); border:1px solid rgba(123,44,255,.45); border-radius:8px; padding:28px; box-shadow:0 0 35px rgba(123,44,255,.18); }
.login-card h1{ margin-bottom:10px; font-size:28px; }
.login-card p,.muted{ color:var(--muted); }
.field{ display:flex; flex-direction:column; gap:8px; margin:16px 0; }
.field label{ color:#ddd; font-size:13px; }
.field input,.field textarea,.field select{ width:100%; background:#07070d; color:#fff; border:1px solid #272738; border-radius:6px; padding:12px; outline:none; }
.field textarea{ min-height:110px; resize:vertical; }
.field input:focus,.field textarea:focus,.field select:focus{ border-color:var(--morado); box-shadow:0 0 0 3px rgba(123,44,255,.16); }
.btn{ border:0; color:#fff; background:linear-gradient(90deg,var(--morado),var(--naranja)); border-radius:6px; padding:11px 16px; font-weight:800; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn.secondary{ background:#1d1d2f; border:1px solid #33334a; }
.btn.danger{ background:var(--danger); }
.btn.small{ padding:8px 10px; font-size:12px; }
.btn:disabled{ opacity:.55; cursor:not-allowed; }
.error{ margin-top:14px; color:#ff8b9d; min-height:20px; }
.admin-shell{ min-height:100vh; display:grid; grid-template-columns:260px 1fr; }
.sidebar{ background:var(--sidebar); border-right:2px solid var(--morado); padding:22px 16px; position:sticky; top:0; height:100vh; }
.brand{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
.brand img{ width:46px; height:46px; object-fit:contain; }
.brand strong{ font-size:18px; }
.nav{ display:flex; flex-direction:column; gap:10px; }
.nav button{ background:transparent; color:#ddd; border:1px solid transparent; border-radius:6px; padding:12px; text-align:left; }
.nav button.active,.nav button:hover{ background:#151528; border-color:rgba(123,44,255,.7); color:#fff; }
.main{ min-width:0; }
.topbar{ min-height:70px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid rgba(255,255,255,.08); padding:14px 24px; background:rgba(10,10,15,.85); position:sticky; top:0; z-index:5; backdrop-filter:blur(10px); flex-wrap:wrap; }
.hamburger{ display:none; background:#151528; color:#fff; border:1px solid #33334a; border-radius:6px; padding:10px 12px; }
.user-box{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
.badge{ background:rgba(123,44,255,.18); border:1px solid var(--morado); color:#fff; border-radius:999px; padding:6px 10px; font-size:12px; }
.content{ padding:26px; }
.section-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; }
.section-head h2{ font-size:28px; margin-bottom:6px; }
.panel{ background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:8px; overflow:hidden; }
.table-wrap{ overflow:auto; -webkit-overflow-scrolling:touch; }
table{ width:100%; border-collapse:collapse; min-width:760px; }
th,td{ padding:14px; border-bottom:1px solid rgba(255,255,255,.08); text-align:left; vertical-align:middle; }
th{ color:#fff; background:#151528; font-size:13px; }
td{ color:#d7d7e5; font-size:13px; }
td img{ width:52px; height:52px; object-fit:cover; border-radius:6px; border:1px solid #33334a; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; }
.empty{ padding:24px; color:var(--muted); text-align:center; }
.modal{ position:fixed; inset:0; background:rgba(0,0,0,.78); display:flex; align-items:center; justify-content:center; padding:18px; z-index:20; }
.modal-card{ width:min(760px,100%); max-height:90vh; overflow:auto; background:#101020; border:1px solid rgba(123,44,255,.55); border-radius:8px; padding:22px; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:12px; }
.form-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.field.full{ grid-column:1 / -1; }
.help{ color:var(--muted); font-size:12px; line-height:1.5; }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap; }
@media(max-width:1024px){
    .admin-shell{ grid-template-columns:1fr; }
    .sidebar{ position:fixed; inset:0 auto 0 0; width:260px; z-index:15; transform:translateX(-100%); transition:.25s; box-shadow:12px 0 30px rgba(0,0,0,.35); }
    .sidebar.open{ transform:translateX(0); }
    .hamburger{ display:inline-flex; }
    .topbar{ padding:12px 16px; }
    .user-box{ width:100%; justify-content:flex-start; }
    .content{ padding:18px; }
    .form-grid{ grid-template-columns:1fr; }
    .section-head{ flex-direction:column; }
    .section-head h2{ font-size:24px; }
    .modal-card{ width:min(760px, calc(100% - 16px)); }
}

@media(max-width:768px){
    .topbar{ gap:12px; }
    .badge{ padding:5px 9px; }
    .table-wrap{ overflow-x:auto; }
    table{ min-width:760px; }
    .content{ padding:16px; }
    .modal{ padding:12px; }
    .modal-card{ padding:18px; }
}

@media(max-width:480px){
    .login-card{ padding:22px; }
    .login-card h1{ font-size:24px; }
    .field{ margin:14px 0; }
    .field label{ font-size:11px; }
    .topbar{ padding:10px 12px; }
    .user-box{ gap:8px; }
    .content{ padding:12px; }
    .modal-card{ padding:16px; }
}
</style>
</head>
<body>

<section id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
        <h1>VORANIX Admin</h1>
        <p>Ingresa con una cuenta autorizada como admin o editor.</p>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit">Ingresar</button>
        <button class="btn secondary" type="button" data-logout>Cerrar sesión</button>
        <div id="login-error" class="error"></div>
    </form>
</section>

<section id="admin-shell" class="admin-shell hidden">
    <aside id="sidebar" class="sidebar">
        <div class="brand">
            <img src="/imagenes/logopng.png" alt="VORANIX">
            <strong>VORANIX</strong>
        </div>
        <nav id="nav" class="nav"></nav>
    </aside>
    <main class="main">
        <header class="topbar">
            <button id="hamburger" class="hamburger" type="button">☰</button>
            <div>
                <strong id="section-title">Dashboard</strong>
                <div class="muted" id="section-subtitle">Administración de contenido</div>
            </div>
            <div class="user-box">
                <span id="user-email" class="muted"></span>
                <span id="role-badge" class="badge"></span>
                <a class="btn secondary" href="/admin/migrar.html">Migrar</a>
                <button class="btn secondary" type="button" data-logout>Cerrar sesión</button>
            </div>
        </header>
        <div id="content" class="content"></div>
    </main>
</section>

<div id="modal" class="modal hidden">
    <form id="item-form" class="modal-card">
        <div class="modal-head">
            <h2 id="modal-title">Editar</h2>
            <button class="btn secondary small" type="button" id="close-modal">Cerrar</button>
        </div>
        <div id="form-fields" class="form-grid"></div>
        <div id="form-error" class="error"></div>
        <div class="modal-actions">
            <button class="btn secondary" type="button" id="cancel-modal">Cancelar</button>
            <button class="btn" type="submit" id="save-item">Guardar</button>
        </div>
    </form>
</div>

<script type="module">

import {
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
    collection,
    doc,
    getDoc,
    getDocs,
    onSnapshot,
    addDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

import { auth, db, storage, escapeHtml } from "/assets/js/firebase-config.js";

const RANGO_BASES = [
    ["hierro", "Hierro"],
    ["bronce", "Bronce"],
    ["plata", "Plata"],
    ["oro", "Oro"],
    ["platino", "Platino"],
    ["diamante", "Diamante"],
    ["ascendente", "Ascendente"],
    ["inmortal", "Inmortal"]
];
const VALORANT_RANKS = [["", "Sin rango"]].concat(
    RANGO_BASES.flatMap(([value, label]) => [1, 2, 3].map(tier => [`${value}${tier}`, `${label} ${tier}`])),
    [["radiante", "Radiante"]]
);

const VALORANT_ROLES = [
    ["", "Sin rol"],
    ["duelista", "Duelista"],
    ["controlador", "Controlador"],
    ["centinela", "Centinela"],
    ["iniciador", "Iniciador"]
];

const TIPO_JUGADOR = [
    ["", "Sin especificar"],
    ["principal", "Jugador Principal"],
    ["suplente", "Jugador Suplente"],
    ["coach", "Coach"],
    ["igl", "IGL"],
    ["capitan", "Capitán"]
];

const PAISES = [
    ["chile", "Chile"],
    ["mexico", "México"],
    ["argentina", "Argentina"]
];

const sections = {
    // Definicion de cada CRUD: etiqueta visible, coleccion y campos del modal.
    valorant: {
        label: "Rosters Valorant",
        collection: "rosters",
        filterValue: "valorant",
        fields: [
            ["nombre", "Nombre", "text"],
            ["juego", "Juego", "select", [["valorant", "Valorant"]]],
            ["rol", "Rol", "select", VALORANT_ROLES],
            ["rango", "Rango", "select", VALORANT_RANKS],
            ["tipoJugador", "Tipo de Jugador", "select", TIPO_JUGADOR],
            ["foto", "Imagen", "image"],
            ["activo", "Activo", "boolean"]
        ]
    },
    fifa: {
        label: "Rosters FIFA",
        collection: "rosters",
        filterValue: "fifa",
        fields: [
            ["nombre", "Nombre", "text"],
            ["juego", "Juego", "select", [["fifa", "EA FC"]]],
            ["rol", "Rol", "text"],
            ["rango", "Rango", "text"],
            ["tipoJugador", "Tipo de Jugador", "select", TIPO_JUGADOR],
            ["foto", "Imagen", "image"],
            ["activo", "Activo", "boolean"]
        ]
    },
    streamers: {
        label: "Streamers",
        collection: "streamers",
        fields: [
            ["nombre", "Nombre", "text"],
            ["juegos", "Juegos", "text"],
            ["horario", "Horario", "text"],
            ["pais", "País", "select", PAISES],
            ["foto", "Imagen", "imageurl"],
            ["instagram", "Instagram", "url"],
            ["twitch", "Twitch", "url"],
            ["activo", "Activo", "boolean"]
        ]
    },
    influencers: {
        label: "Influencers",
        collection: "influencers",
        fields: [
            ["nombre", "Nombre", "text"],
            ["categoria", "Categoría", "text"],
            ["pais", "País", "select", PAISES],
            ["foto", "Imagen", "imageurl"],
            ["instagram", "Instagram", "url"],
            ["tiktok", "TikTok", "url"],
            ["activo", "Activo", "boolean"]
        ]
    },
    patrocinadores: {
        label: "Patrocinadores",
        collection: "sponsors",
        fields: [
            ["nombre", "Nombre", "text"],
            ["descripcion", "Descripción", "textarea"],
            ["logo", "Logo", "image"],
            ["web", "Website URL", "url"],
            ["tipo", "Tipo", "select", [["patrocinador", "Patrocinador (dorado, arriba)"], ["colaborador", "Colaborador (morado)"]]],
            ["activo", "Activo", "boolean"]
        ]
    },
    proyectos: {
        label: "Proyectos",
        collection: "proyectos",
        fields: [
            ["titulo", "Título", "text"],
            ["fecha", "Fecha", "text"],
            ["descripcion", "Descripción corta", "textarea"],
            ["textoLargo", "Texto largo", "textarea"],
            ["img", "Imagen", "image"],
            ["link", "Link", "url"],
            ["upcoming", "Próximo", "boolean"]
        ]
    },
    staff: {
        label: "Staff",
        collection: "staff",
        fields: [
            ["nombre", "Nombre", "text"],
            ["cargo", "Cargo", "text"],
            ["foto", "Imagen", "image"],
            ["instagram", "Instagram", "url"],
            ["twitter", "Twitter/X", "url"],
            ["discord", "Discord", "url"],
            ["activo", "Activo", "boolean"]
        ]
    },
    mensajes: {
        label: "Mensajes",
        collection: "mensajes",
        hideAdd: true,
        fields: [
            ["nombre", "Nombre", "text"],
            ["email", "Email", "text"],
            ["asunto", "Motivo", "text"],
            ["mensaje", "Mensaje", "textarea"],
            ["leido", "Leído", "boolean"]
        ]
    },
    accesos: {
        label: "Accesos Creadores",
        collection: "accesos",
        fields: [
            ["titulo", "Título", "text"],
            ["categoria", "Categoría", "select", [
                ["torneo", "Torneo"],
                ["evento", "Evento"],
                ["actividad", "Actividad"],
                ["proyecto", "Proyecto"],
                ["general", "General"]
            ]],
            ["descripcion", "Descripción", "textarea"],
            ["link", "Link (Google Form)", "url"],
            ["fechaLimite", "Fecha límite", "text"],
            ["activo", "Publicado", "boolean"]
        ]
    }
};

let currentUser = null;
let currentProfile = null;
let currentSection = "valorant";
let unsubscribeList = null;
let editingId = null;
let editingData = {};
let usersCache = [];

// Referencias del DOM usadas por el login, layout y modal.
const loginScreen = document.getElementById("login-screen");
const adminShell = document.getElementById("admin-shell");
const loginForm = document.getElementById("login-form");
const loginError = document.getElementById("login-error");
const nav = document.getElementById("nav");
const content = document.getElementById("content");
const sectionTitle = document.getElementById("section-title");
const sectionSubtitle = document.getElementById("section-subtitle");
const userEmail = document.getElementById("user-email");
const roleBadge = document.getElementById("role-badge");
const modal = document.getElementById("modal");
const itemForm = document.getElementById("item-form");
const formFields = document.getElementById("form-fields");
const formError = document.getElementById("form-error");
const modalTitle = document.getElementById("modal-title");
const sidebar = document.getElementById("sidebar");

function showError(target, message){
    target.textContent = message || "";
}

function hasValidRole(profile){
    return profile && profile.active !== false && ["admin", "editor"].includes(profile.role);
}

function isAdmin(){
    return currentProfile?.role === "admin";
}

async function loadProfile(user){
    const userRef = doc(db, "users", user.uid);
    const snapshot = await getDoc(userRef);

    if(snapshot.exists()){
        return snapshot.data();
    }

    return null;
}

function showLogin(){
    loginScreen.classList.remove("hidden");
    adminShell.classList.add("hidden");
}

function showAdmin(){
    loginScreen.classList.add("hidden");
    adminShell.classList.remove("hidden");
    userEmail.textContent = currentProfile.email || currentUser.email;
    roleBadge.textContent = currentProfile.role === "admin" ? "ADMIN" : "EDITOR";
    buildNav();
    selectSection(currentSection);
}

function buildNav(){
    const entries = Object.entries(sections);
    nav.innerHTML = entries.map(([key, section]) => `
<button type="button" data-section="${key}" class="${key === currentSection ? "active" : ""}">${section.label}</button>
`).join("") + (isAdmin() ? `<button type="button" data-section="users" class="${currentSection === "users" ? "active" : ""}">Usuarios</button>` : "");
}

function selectSection(key){
    if(key === "users" && !isAdmin()) key = "valorant";
    currentSection = key;
    buildNav();
    sidebar.classList.remove("open");
    if(unsubscribeList) unsubscribeList();
    if(key === "users") renderUsers();
    else renderCrudSection(sections[key]);
}

function getUsersFieldValue(data, name){
    if(name === "active") return data.active !== false;
    return data[name] ?? "";
}

function assetUrl(path) {
    if (!path) return "";
    return /^https?:\/\//.test(path) || path.startsWith("/") ? path : "/" + path;
}

function tableValue(value, type, options){
    if(type === "image" || type === "imageurl") return value ? `<img src="${escapeHtml(assetUrl(value))}" alt="imagen">` : "-";
    if(type === "boolean") return value ? "Sí" : "No";
    if(type === "json") return Array.isArray(value) ? `${value.length} cupón(es)` : "-";
    if(type === "select" && Array.isArray(options)){
        const match = options.find(option => Array.isArray(option) ? option[0] === value : option === value);
        if(match) return escapeHtml(Array.isArray(match) ? match[1] : match);
    }
    return value ? escapeHtml(value) : "-";
}

function renderCrudSection(section){
    // Cada seccion de contenido usa la misma tabla y se actualiza en tiempo real.
    sectionTitle.textContent = section.label;
    sectionSubtitle.textContent = `Colección: ${section.collection}`;
    content.innerHTML = `
<div class="section-head">
    <div>
        <h2>${section.label}</h2>
        <p class="muted">Los cambios se sincronizan en tiempo real con Firestore.</p>
    </div>
    ${section.hideAdd ? "" : '<button class="btn" type="button" id="add-item">Agregar</button>'}
</div>
<div class="panel">
    <div class="table-wrap">
        <table>
            <thead><tr>${section.fields.map(field => `<th>${field[1]}</th>`).join("")}<th>Acciones</th></tr></thead>
            <tbody id="items-body"><tr><td colspan="${section.fields.length + 1}">Cargando...</td></tr></tbody>
        </table>
    </div>
</div>`;

    const addItemBtn = document.getElementById("add-item");
    if(addItemBtn) addItemBtn.addEventListener("click", () => openItemModal());
    const body = document.getElementById("items-body");

    unsubscribeList = onSnapshot(collection(db, section.collection), (snapshot) => {
        const docs = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
        console.log(section.collection, docs.map(d => d));
        const filteredDocs = section.filterValue
            ? docs.filter(item => String(item.juego || "").toLowerCase() === section.filterValue)
            : docs;
        const rows = filteredDocs.map(item => {
            const data = item;
            return `<tr>
${section.fields.map(field => `<td>${tableValue(data[field[0]], field[2], field[3])}</td>`).join("")}
<td><div class="actions">
    <button class="btn secondary small" type="button" data-edit="${item.id}">Editar</button>
    <button class="btn danger small" type="button" data-delete="${item.id}">Eliminar</button>
</div></td>
</tr>`;
        });
        body.innerHTML = rows.length ? rows.join("") : `<tr><td colspan="${section.fields.length + 1}" class="empty">No hay registros.</td></tr>`;
    }, (error) => {
        console.error(error);
        body.innerHTML = `<tr><td colspan="${section.fields.length + 1}" class="empty">No se pudieron cargar los datos.</td></tr>`;
    });
}

async function renderUsers(){
    // La vista de usuarios usa lecturas directas de Firestore y edición por modal.
    unsubscribeList = null;
    sectionTitle.textContent = "Usuarios";
    sectionSubtitle.textContent = "Colección: users";
    content.innerHTML = `
<div class="section-head">
    <div>
        <h2>Usuarios</h2>
        <p class="muted">Administración de perfiles almacenados en Firestore.</p>
    </div>
    <button class="btn" type="button" id="add-user">Agregar</button>
</div>
<div class="panel">
    <div class="table-wrap">
        <table>
            <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Activo</th><th>Acciones</th></tr></thead>
            <tbody id="users-body"><tr><td colspan="5">Cargando...</td></tr></tbody>
        </table>
    </div>
</div>`;

    const addUserBtn = document.getElementById("add-user");
    if(addUserBtn) addUserBtn.addEventListener("click", () => openItemModal(null, { role: "creador", active: true }));

    const body = document.getElementById("users-body");
    try{
        const snapshot = await getDocs(collection(db, "users"));
        usersCache = snapshot.docs.map(item => ({ uid: item.id, ...item.data() }));
        console.log("users", usersCache);

        const rows = usersCache.map(user => `
<tr>
<td>${user.displayName ? escapeHtml(user.displayName) : "-"}</td>
<td>${user.email ? escapeHtml(user.email) : "-"}</td>
<td>${user.role ? escapeHtml(user.role) : "-"}</td>
<td>${user.active === false ? "No" : "Sí"}</td>
<td><div class="actions">
    <button class="btn secondary small" type="button" data-user-edit="${user.uid}">Editar</button>
</div></td>
</tr>`);

        body.innerHTML = rows.length ? rows.join("") : `<tr><td colspan="5" class="empty">No hay usuarios.</td></tr>`;
    }catch(error){
        console.error(error);
        body.innerHTML = `<tr><td colspan="5" class="empty">No se pudieron cargar los usuarios.</td></tr>`;
    }
}

function fieldHtml(field, value){
    // El modal se arma desde la definicion de campos para evitar duplicar formularios.
    const [name, label, type, options] = field;
    const safeValue = value ?? "";
    const full = ["textarea", "json", "image"].includes(type) ? " full" : "";

    if(type === "textarea"){
        return `<div class="field${full}"><label>${label}</label><textarea name="${name}">${escapeHtml(safeValue)}</textarea></div>`;
    }

    if(type === "json"){
        const jsonValue = Array.isArray(value) ? JSON.stringify(value, null, 2) : "[]";
        return `<div class="field${full}"><label>${label}</label><textarea name="${name}">${jsonValue}</textarea><span class="help">Formato: [{"titulo":"...","descripcion":"...","codigo":"..."}]</span></div>`;
    }

    if(type === "select"){
        const opts = options.map(option => Array.isArray(option) ? option : [option, option]);
        return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(([optValue, optLabel]) => `<option value="${optValue}" ${optValue === safeValue ? "selected" : ""}>${optLabel}</option>`).join("")}</select></div>`;
    }

    if(type === "boolean"){
        return `<div class="field"><label>${label}</label><select name="${name}"><option value="false" ${!safeValue ? "selected" : ""}>No</option><option value="true" ${safeValue ? "selected" : ""}>Sí</option></select></div>`;
    }

    if(type === "image"){
        const preview = safeValue ? `<img src="${escapeHtml(assetUrl(safeValue))}" alt="${label}" style="width:100%;max-width:220px;height:120px;object-fit:cover;border-radius:6px;border:1px solid #33334a;margin-top:10px;">` : "";
        return `<div class="field${full}"><label>${label}</label><div style="display:flex;gap:8px;align-items:center;"><input name="${name}" type="text" value="${escapeHtml(safeValue)}" placeholder="Ruta o URL de imagen" style="flex:1;"><button type="button" class="btn danger small" title="Eliminar imagen" onclick="this.closest('div').querySelector('input[type=text]').value=''; this.closest('.field').querySelector('input[type=file]').value='';">🗑️</button></div><input name="${name}File" type="file" accept="image/*"><span class="help">Puedes pegar una ruta relativa, una URL o subir una imagen a Firebase Storage.</span>${preview}</div>`;
    }

    if(type === "imageurl"){
        return `<div class="field"><label>${label}</label><div style="display:flex;gap:8px;align-items:center;"><input name="${name}" type="text" value="${escapeHtml(safeValue)}" placeholder="URL de la imagen" style="flex:1;"><button type="button" class="btn danger small" title="Eliminar imagen" onclick="this.closest('div').querySelector('input[type=text]').value=''; this.closest('.field').querySelector('input[type=file]').value='';">🗑️</button></div><input name="${name}File" type="file" accept="image/*" style="margin-top:6px;font-size:11px;"><span class="help">Pegá una URL o subí un archivo pequeño desde tu dispositivo.</span></div>`;
    }

    return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${escapeHtml(safeValue)}"></div>`;
}

function userFieldHtml(name, value, disabled = false){
    const safeValue = value ?? "";

    if(name === "role"){
        return `
<div class="field">
    <label>Rol</label>
    <select name="role" ${disabled ? "disabled" : ""}>
        <option value="admin" ${safeValue === "admin" ? "selected" : ""}>admin</option>
        <option value="editor" ${safeValue === "editor" ? "selected" : ""}>editor</option>
        <option value="creador" ${safeValue === "creador" ? "selected" : ""}>creador</option>
        <option value="viewer" ${safeValue === "viewer" ? "selected" : ""}>viewer</option>
    </select>
</div>`;
    }

    if(name === "active"){
        return `
<div class="field">
    <label style="display:flex;align-items:center;gap:10px;">
        <input name="active" type="checkbox" ${safeValue ? "checked" : ""} ${disabled ? "disabled" : ""} style="width:auto;">
        <span>Activo</span>
    </label>
</div>`;
    }

    return `<div class="field"><label>${name === "displayName" ? "Nombre" : name}</label><input name="${name}" type="text" value="${escapeHtml(safeValue)}" ${disabled ? "disabled" : ""}></div>`;
}

function openItemModal(id = null, data = {}){
    const section = currentSection === "users" ? null : sections[currentSection];
    editingId = id;
    editingData = data;
    modalTitle.textContent = currentSection === "users"
        ? (id ? "Editar usuario" : "Agregar usuario")
        : (id ? `Editar ${section.label}` : `Agregar ${section.label}`);
    formError.textContent = "";
    if(currentSection === "users"){
        const isNew = !id;
        formFields.innerHTML = `
<div class="field">
    <label>UID</label>
    <input name="uid" type="text" value="${escapeHtml(data.uid || id || "")}" ${isNew ? "" : "disabled"}>
    ${isNew ? '<span class="help">Cópialo desde Firebase Console → Authentication, después de crear el login de esa cuenta.</span>' : ""}
</div>
<div class="field">
    <label>Email</label>
    <input name="email" type="email" value="${escapeHtml(data.email || "")}" ${isNew ? "" : "disabled"}>
</div>
${userFieldHtml("displayName", getUsersFieldValue(data, "displayName"))}
${userFieldHtml("role", getUsersFieldValue(data, "role"))}
${userFieldHtml("active", getUsersFieldValue(data, "active"))}
`;
    }else{
        formFields.innerHTML = section.fields.map(field => fieldHtml(field, data[field[0]])).join("");
    }
    modal.classList.remove("hidden");
}

function closeModal(){
    modal.classList.add("hidden");
    itemForm.reset();
    editingId = null;
    editingData = {};
}

async function uploadImage(file, bucketPath, fieldName){
    const fileName = `${Date.now()}-${file.name}`.replace(/\s+/g, "_");
    const storageRef = ref(storage, `${bucketPath}/${fieldName}/${fileName}`);
    const snapshot = await uploadBytes(storageRef, file);
    return await getDownloadURL(snapshot.ref);
}

async function saveItem(event){
    event.preventDefault();
    const formData = new FormData(itemForm);
    const payload = {};
    showError(formError, "");

    try{
        if(currentSection === "users"){
            payload.displayName = formData.get("displayName") || "";
            payload.role = formData.get("role") || "viewer";
            payload.active = formData.get("active") === "on";

            if(editingId){
                await updateDoc(doc(db, "users", editingId), payload);
            }else{
                const uid = String(formData.get("uid") || "").trim();
                const email = String(formData.get("email") || "").trim();
                if(!uid){
                    showError(formError, "Debes indicar el UID (cópialo desde Firebase Console → Authentication).");
                    return;
                }
                payload.email = email;
                payload.createdAt = serverTimestamp();
                await setDoc(doc(db, "users", uid), payload);
            }
            closeModal();
            await renderUsers();
            return;
        }

        const section = sections[currentSection];
        for(const field of section.fields){
            const [name, , type] = field;
            const file = formData.get(`${name}File`);
            const urlValue = String(formData.get(name) ?? "").trim();
            const currentValue = editingData[name];

            if((type === "image" || type === "imageurl") && file && file.size){
                payload[name] = await uploadImage(file, section.collection, name);
            }else if(type === "image"){
                if(urlValue){
                    payload[name] = urlValue;
                }else if(editingId && currentValue){
                    payload[name] = currentValue;
                }
            }else if(type === "json"){
                const raw = formData.get(name) || "[]";
                payload[name] = JSON.parse(raw);
            }else if(type === "boolean"){
                payload[name] = formData.get(name) === "true";
            }else{
                payload[name] = formData.get(name) || "";
            }
        }

        payload.updatedAt = serverTimestamp();

        if(editingId){
            await updateDoc(doc(db, section.collection, editingId), payload);
        }else{
            payload.createdAt = serverTimestamp();
            await addDoc(collection(db, section.collection), payload);
        }

        closeModal();
    }catch(error){
        console.error(error);
        showError(formError, "No se pudo guardar. Revisa los campos y permisos.");
    }
}

nav.addEventListener("click", (event) => {
    const button = event.target.closest("[data-section]");
    if(button) selectSection(button.dataset.section);
});

content.addEventListener("click", async (event) => {
    const editButton = event.target.closest("[data-edit]");
    const userEditButton = event.target.closest("[data-user-edit]");
    const deleteButton = event.target.closest("[data-delete]");
    const roleButton = event.target.closest("[data-role]");
    const disableButton = event.target.closest("[data-disable]");

    try{
        if(userEditButton){
            const user = usersCache.find(item => item.uid === userEditButton.dataset.userEdit);
            if(user) openItemModal(user.uid, user);
        }

        if(editButton){
            const section = sections[currentSection];
            const snapshot = await getDoc(doc(db, section.collection, editButton.dataset.edit));
            if(snapshot.exists()) openItemModal(snapshot.id, snapshot.data());
        }

        if(deleteButton && confirm("¿Eliminar este registro?")){
            const section = sections[currentSection];
            await deleteDoc(doc(db, section.collection, deleteButton.dataset.delete));
        }

        if(roleButton){
            await updateDoc(doc(db, "users", roleButton.dataset.role), { role: roleButton.dataset.nextRole, updatedAt: serverTimestamp() });
        }

        if(disableButton && confirm("¿Desactivar este usuario?")){
            await updateDoc(doc(db, "users", disableButton.dataset.disable), { active: false, updatedAt: serverTimestamp() });
            await renderUsers();
        }
    }catch(error){
        console.error(error);
        alert("No se pudo completar la operación. Revisa permisos o conexión.");
    }
});

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    showError(loginError, "");

    try{
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        await signInWithEmailAndPassword(auth, email, password);
    }catch(error){
        console.error(error);
        showError(loginError, "Email o contraseña incorrectos.");
    }
});

document.querySelectorAll("[data-logout]").forEach(button => {
    button.addEventListener("click", () => signOut(auth));
});

document.getElementById("hamburger").addEventListener("click", () => sidebar.classList.toggle("open"));
document.getElementById("close-modal").addEventListener("click", closeModal);
document.getElementById("cancel-modal").addEventListener("click", closeModal);
itemForm.addEventListener("submit", saveItem);





onAuthStateChanged(auth, async (user) => {
    // Firebase recuerda la sesion; si ya esta logueado se muestra el dashboard.
    currentUser = user;

    if(!user){
        currentProfile = null;
        if(unsubscribeList) unsubscribeList();
        showLogin();
        return;
    }

    try{
        currentProfile = await loadProfile(user);

        if(!hasValidRole(currentProfile)){
            showError(loginError, "Tu cuenta no tiene permisos de administración.");
            await signOut(auth);
            return;
        }

        showAdmin();
    }catch(error){
        console.error("ERROR LOGIN:");
        console.error(error);
        alert(
            "Código: " + error.code +
            "\nMensaje: " + error.message
        );

        showError(loginError, error.message);
        await signOut(auth);
    }
});
