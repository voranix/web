<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin VORANIX</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/imagenes/logopng.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --morado:#7b2cff; --naranja:#ff6a00; --bg:#0a0a0f; --sidebar:#0d0d18; --card:#111122; --text:#ffffff; --muted:#a9a9bc; --danger:#ff3b5c; --ok:#00c853; }
*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ height:100%; overflow:hidden; }
body{ background:var(--bg); color:var(--text); font-family:"Orbitron",sans-serif; }
img, iframe{ max-width:100%; display:block; }
button,input,textarea,select{ font:inherit; max-width:100%; }
button{ cursor:pointer; }
.hidden{ display:none !important; }
.login-screen{ height:100vh; overflow-y:auto; display:grid; place-items:center; padding:24px; }
.login-card{ width:min(420px,100%); background:var(--card); border:1px solid rgba(123,44,255,.45); border-radius:8px; padding:28px; box-shadow:0 0 35px rgba(123,44,255,.18); }
.login-card h1{ margin-bottom:10px; font-size:28px; }
.login-card p,.muted{ color:var(--muted); }
.field{ display:flex; flex-direction:column; gap:8px; margin:16px 0; }
.field label{ color:#ddd; font-size:13px; }
.field input,.field textarea,.field select{ width:100%; background:#07070d; color:#fff; border:1px solid #272738; border-radius:6px; padding:12px; outline:none; }
.field textarea{ min-height:110px; resize:vertical; }
.field input:focus,.field textarea:focus,.field select:focus{ border-color:var(--morado); box-shadow:0 0 0 3px rgba(123,44,255,.16); }
.lineup-select{ position:relative; flex:1; min-width:0; }
.lineup-select-trigger{ width:100%; background:#07070d; color:#fff; border:1px solid #272738; border-radius:6px; padding:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; }
.lineup-select-trigger .placeholder{ color:#7a7a90; }
.lineup-select-trigger .arrow{ font-size:10px; opacity:.7; flex-shrink:0; }
.lineup-select.open .lineup-select-trigger{ border-color:var(--morado); box-shadow:0 0 0 3px rgba(123,44,255,.16); }
.lineup-select-panel{ position:fixed; z-index:200; background:#0d0d18; border:1px solid #272738; border-radius:6px; overflow-y:auto; box-shadow:0 12px 30px rgba(0,0,0,.55); }
.lineup-select-option{ padding:10px 12px; font-size:14px; cursor:pointer; color:#fff; }
.lineup-select-option:hover,.lineup-select-option.active{ background:rgba(123,44,255,.25); }
.lineup-select-option.placeholder{ color:#7a7a90; }
.lineup-mvp-btn{ background:#1d1d2f; border:1px solid #33334a; border-radius:6px; padding:8px 10px; font-size:16px; line-height:1; opacity:.4; filter:grayscale(1); flex-shrink:0; }
.lineup-mvp-btn.active{ opacity:1; filter:none; background:rgba(255,193,7,.15); border-color:#ffc107; box-shadow:0 0 12px rgba(255,193,7,.35); }
.lineup-row.is-mvp{ background:rgba(255,193,7,.06); border-radius:8px; padding:4px; margin:-4px -4px 8px; }
.btn{ border:0; color:#fff; background:linear-gradient(90deg,var(--morado),var(--naranja)); border-radius:6px; padding:11px 16px; font-weight:800; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn.secondary{ background:#1d1d2f; border:1px solid #33334a; }
.btn.danger{ background:var(--danger); }
.btn.small{ padding:8px 10px; font-size:12px; }
.btn:disabled{ opacity:.55; cursor:not-allowed; }
.error{ margin-top:14px; color:#ff8b9d; min-height:20px; }
.admin-shell{ height:100vh; display:grid; grid-template-columns:260px 1fr; }
.sidebar{ background:var(--sidebar); border-right:2px solid var(--morado); padding:22px 16px; height:100vh; overflow-y:auto; display:flex; flex-direction:column; }
.brand{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
.brand img{ width:46px; height:46px; object-fit:contain; }
.brand strong{ font-size:18px; }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav-group{ margin-bottom:6px; }
.nav-group:last-child{ margin-bottom:0; }
.nav-group-label{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:6px;
    background:none; border:none; cursor:pointer; color:var(--muted); opacity:.75; font-family:inherit;
    font-size:10px; letter-spacing:1.5px; text-transform:uppercase; padding:8px 10px 6px;
}
.nav-group-label:hover{ opacity:1; color:#fff; }
.nav-group-arrow{ font-style:normal; font-size:9px; transition:transform .15s; flex-shrink:0; }
.nav-group.collapsed .nav-group-arrow{ transform:rotate(-90deg); }
.nav-group-items{ display:flex; flex-direction:column; gap:2px; }
.nav-group.collapsed .nav-group-items{ display:none; }
.nav button[data-section]{ display:flex; align-items:center; gap:8px; width:100%; background:transparent; color:#ddd; border:1px solid transparent; border-radius:6px; padding:8px 10px; text-align:left; margin-bottom:2px; font-size:12px; line-height:1.3; }
.nav button[data-section].active,.nav button[data-section]:hover{ background:#151528; border-color:rgba(123,44,255,.7); color:#fff; }
.nav-icon{ font-size:14px; width:18px; text-align:center; flex-shrink:0; }
.main{ min-width:0; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.topbar{ min-height:70px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid rgba(255,255,255,.08); padding:14px 24px; background:rgba(10,10,15,.85); flex:0 0 auto; z-index:5; backdrop-filter:blur(10px); flex-wrap:wrap; }
.topbar-left{ display:flex; align-items:center; gap:12px; }
.hamburger{ display:none; background:#151528; color:#fff; border:1px solid #33334a; border-radius:6px; padding:10px 12px; }
.sidebar-collapse{ background:#151528; color:#fff; border:1px solid #33334a; border-radius:6px; padding:10px 12px; font-size:12px; white-space:nowrap; }
.admin-shell{ transition:grid-template-columns .2s; }
.admin-shell.sidebar-collapsed{ grid-template-columns:0 1fr; }
.admin-shell.sidebar-collapsed .sidebar{ padding:0; border-right:none; overflow:hidden; }
@media(max-width:1024px){ .sidebar-collapse{ display:none; } }
.user-box{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
.badge{ background:rgba(123,44,255,.18); border:1px solid var(--morado); color:#fff; border-radius:999px; padding:6px 10px; font-size:12px; }
.content{ padding:26px; flex:1 1 auto; overflow-y:auto; }
.section-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; }
.section-head h2{ font-size:28px; margin-bottom:6px; }
.panel{ background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:8px; overflow:hidden; }
.table-toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:16px; border-bottom:1px solid rgba(255,255,255,.08); }
.table-toolbar input[type="search"]{ flex:1 1 220px; min-width:160px; background:#07070d; color:#fff; border:1px solid #272738; border-radius:6px; padding:10px 12px; outline:none; }
.table-toolbar select{ background:#07070d; color:#fff; border:1px solid #272738; border-radius:6px; padding:10px 12px; outline:none; max-width:220px; }
.table-toolbar input[type="search"]:focus,.table-toolbar select:focus{ border-color:var(--morado); box-shadow:0 0 0 3px rgba(123,44,255,.16); }
.table-toolbar .count{ color:var(--muted); font-size:12px; white-space:nowrap; margin-left:auto; }
.table-wrap{ overflow:auto; -webkit-overflow-scrolling:touch; }
table{ width:100%; border-collapse:collapse; min-width:760px; }
th,td{ padding:14px; border-bottom:1px solid rgba(255,255,255,.08); text-align:left; vertical-align:middle; }
th{ color:#fff; background:#151528; font-size:13px; }
td{ color:#d7d7e5; font-size:13px; }
td img{ width:52px; height:52px; object-fit:cover; border-radius:6px; border:1px solid #33334a; }
.cell-clamp{ display:block; max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:help; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; }
.empty{ padding:24px; color:var(--muted); text-align:center; }
.bulk-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.08); background:rgba(123,44,255,.08); }
.bulk-bar .count{ color:#fff; font-size:13px; font-weight:600; }
td.select-col,th.select-col{ width:40px; text-align:center; }
.modal{ position:fixed; inset:0; background:rgba(0,0,0,.78); display:flex; align-items:center; justify-content:center; padding:18px; z-index:20; }
.modal-card{ width:min(760px,100%); max-height:90vh; overflow:auto; background:#101020; border:1px solid rgba(123,44,255,.55); border-radius:8px; padding:22px; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:12px; }
.form-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.field.full{ grid-column:1 / -1; }
.help{ color:var(--muted); font-size:12px; line-height:1.5; }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap; }
.dashboard-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.dashboard-card{ padding:20px; }
.dashboard-card-wide{ grid-column:1 / -1; }
.dashboard-card h3{ font-size:15px; margin-bottom:14px; }
.dashboard-list{ display:flex; flex-direction:column; gap:10px; list-style:none; }
.dashboard-list li{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 12px; background:rgba(255,255,255,.03); border-radius:6px; font-size:13px; }
.dashboard-list strong{ color:#fff; }
.dashboard-tag{ font-size:10.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--morado); background:rgba(123,44,255,.15); border:1px solid rgba(123,44,255,.4); border-radius:20px; padding:3px 9px; white-space:nowrap; }
.dashboard-meta{ color:var(--muted); font-size:12px; margin-left:auto; }
.dashboard-highlight{ color:#fff; font-weight:700; margin-bottom:12px; }
.dashboard-empty{ color:var(--muted); font-size:13px; padding:8px 0; }
@media(max-width:900px){ .dashboard-grid{ grid-template-columns:1fr; } }

.comunicados-groups{ display:flex; flex-wrap:wrap; gap:10px; }
.comunicados-group-chip{
    display:flex; align-items:center; gap:8px; background:#151528; border:1px solid #33334a;
    border-radius:20px; padding:10px 16px; font-size:13px; cursor:pointer; font-weight:normal;
}
.comunicados-group-chip input{ width:auto; }
.comunicados-list{ max-height:340px; overflow-y:auto; border:1px solid #272738; border-radius:6px; }
.comunicados-row{
    display:flex; align-items:center; gap:12px; padding:10px 14px; font-size:13px;
    border-bottom:1px solid #21212f; cursor:pointer; font-weight:normal;
}
.comunicados-row:last-child{ border-bottom:none; }
.comunicados-row:hover{ background:#151528; }
.comunicados-row input{ width:auto; flex-shrink:0; }
.comunicados-row-name{ color:#fff; font-weight:600; flex-shrink:0; }
.comunicados-row-email{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
.comunicados-tag{ font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--morado); background:rgba(123,44,255,.15); border:1px solid rgba(123,44,255,.4); border-radius:20px; padding:2px 9px; white-space:nowrap; flex-shrink:0; }

.tablero-tabs{ display:flex; gap:10px; margin-bottom:22px; }

/* Tablero de ideas (estilo Mural, grilla de notas) */
.ideas-composer{ background:var(--card); border:1px solid #272738; border-radius:8px; padding:16px; margin-bottom:22px; }
.ideas-composer textarea{ width:100%; min-height:70px; background:#07070d; color:#fff; border:1px solid #272738; border-radius:6px; padding:12px; resize:vertical; }
.ideas-composer-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px; flex-wrap:wrap; }
.ideas-color-picker{ display:flex; gap:8px; }
.idea-color-dot{ width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
.idea-color-dot.active{ border-color:#fff; }
.ideas-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
.idea-card{ border:1px solid; border-radius:8px; padding:16px; min-height:110px; display:flex; flex-direction:column; justify-content:space-between; }
.idea-text{ color:#fff; font-size:13px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.idea-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
.idea-author{ font-size:11px; color:var(--muted); }
.idea-delete{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:2px 6px; }
.idea-delete:hover{ color:var(--danger); }

/* Tablero de tareas (estilo Trello/Jira, 4 columnas con drag & drop) */
.tareas-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
.tareas-filter{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); font-weight:normal; }
.tareas-filter input{ width:auto; }
.tareas-board{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; align-items:start; }
.tareas-column{ background:rgba(255,255,255,.02); border:1px solid #272738; border-radius:8px; padding:14px; min-height:200px; }
.tareas-column h4{ font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:6px; }
.tareas-column-count{ color:var(--morado); }
.tareas-column-list{ display:flex; flex-direction:column; gap:10px; min-height:40px; }
.tareas-empty{ color:var(--muted); font-size:12px; text-align:center; padding:16px 0; }
.tarea-card{ background:var(--card); border:1px solid #272738; border-radius:6px; padding:12px; cursor:grab; transition:border-color .2s; }
.tarea-card:hover{ border-color:var(--morado); }
.tarea-card.is-mine{ border-left:3px solid var(--morado); }
.tarea-titulo{ color:#fff; font-size:13px; font-weight:600; margin-bottom:4px; }
.tarea-desc{ color:var(--muted); font-size:12px; margin-bottom:8px; line-height:1.5; }
.tarea-footer{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; }
.tarea-responsable{ font-size:11px; color:#9d5bff; background:rgba(123,44,255,.12); border-radius:20px; padding:3px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tarea-actions{ display:flex; gap:4px; flex-shrink:0; }
.tarea-actions button{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:2px 5px; }
.tarea-actions button:hover{ color:#fff; }
@media(max-width:1100px){ .tareas-board{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:640px){ .tareas-board{ grid-template-columns:1fr; } }
@media(max-width:1024px){
    .admin-shell{ grid-template-columns:1fr; }
    .sidebar{ position:fixed; inset:0 auto 0 0; width:260px; z-index:15; transform:translateX(-100%); transition:.25s; box-shadow:12px 0 30px rgba(0,0,0,.35); }
    .sidebar.open{ transform:translateX(0); }
    .hamburger{ display:inline-flex; }
    .topbar{ padding:12px 16px; }
    .user-box{ width:100%; justify-content:flex-start; }
    .content{ padding:18px; }
    .form-grid{ grid-template-columns:1fr; }
    .section-head{ flex-direction:column; }
    .section-head h2{ font-size:24px; }
    .modal-card{ width:min(760px, calc(100% - 16px)); }
}

@media(max-width:768px){
    .topbar{ gap:12px; }
    .badge{ padding:5px 9px; }
    .table-wrap{ overflow-x:auto; }
    table{ min-width:760px; }
    .content{ padding:16px; }
    .modal{ padding:12px; }
    .modal-card{ padding:18px; }
    .table-toolbar{ padding:12px; }
    .table-toolbar select{ max-width:none; flex:1 1 140px; }
    .table-toolbar .count{ margin-left:0; width:100%; }
}

@media(max-width:480px){
    .login-card{ padding:22px; }
    .login-card h1{ font-size:24px; }
    .field{ margin:14px 0; }
    .field label{ font-size:11px; }
    .topbar{ padding:10px 12px; }
    .user-box{ gap:8px; }
    .content{ padding:12px; }
    .modal-card{ padding:16px; }
}
</style>
</head>
<body>

<section id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
        <h1>VORANIX Admin</h1>
        <p>Ingresa con una cuenta autorizada como admin o editor.</p>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit">Ingresar</button>
        <button class="btn secondary" type="button" data-logout>Cerrar sesión</button>
        <div id="login-error" class="error"></div>
    </form>
</section>

<section id="admin-shell" class="admin-shell hidden">
    <aside id="sidebar" class="sidebar">
        <div class="brand">
            <img src="/imagenes/logopng.png" alt="VORANIX">
            <strong>VORANIX</strong>
        </div>
        <a class="btn secondary" href="/index.html" style="margin-bottom:16px;">← Ir al sitio</a>
        <nav id="nav" class="nav"></nav>
    </aside>
    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button id="hamburger" class="hamburger" type="button">☰</button>
                <button id="sidebar-collapse" class="sidebar-collapse" type="button">Ocultar menú</button>
                <div>
                    <strong id="section-title">Dashboard</strong>
                    <div class="muted" id="section-subtitle">Administración de contenido</div>
                </div>
            </div>
            <div class="user-box">
                <span id="user-email" class="muted"></span>
                <span id="role-badge" class="badge"></span>
                <a class="btn secondary" href="/admin/migrar.html">Migrar</a>
                <button class="btn secondary" type="button" data-logout>Cerrar sesión</button>
            </div>
        </header>
        <div id="content" class="content"></div>
    </main>
</section>

<div id="modal" class="modal hidden">
    <form id="item-form" class="modal-card">
        <div class="modal-head">
            <h2 id="modal-title">Editar</h2>
            <button class="btn secondary small" type="button" id="close-modal">Cerrar</button>
        </div>
        <div id="form-fields" class="form-grid"></div>
        <div id="form-error" class="error"></div>
        <div class="modal-actions">
            <button class="btn secondary" type="button" id="cancel-modal">Cancelar</button>
            <button class="btn" type="submit" id="save-item">Guardar</button>
        </div>
    </form>
</div>

<div id="message-modal" class="modal hidden">
    <form id="message-form" class="modal-card">
        <div class="modal-head">
            <h2>Enviar mensaje</h2>
            <button class="btn secondary small" type="button" id="close-message-modal">Cerrar</button>
        </div>
        <p class="help" id="message-recipients-info" style="margin-bottom:14px;"></p>
        <div class="form-grid">
            <div class="field full">
                <label>Asunto</label>
                <input name="asunto" type="text" required placeholder="Ej: Aviso importante para el equipo">
            </div>
            <div class="field full">
                <label>Mensaje</label>
                <textarea name="mensaje" required placeholder="Escribe el mensaje. Cada línea en blanco separa un párrafo." style="min-height:180px;"></textarea>
                <span class="help">Se manda por correo a cada cuenta seleccionada, con el mismo diseño que los avisos de acceso.</span>
            </div>
        </div>
        <div id="message-error" class="error"></div>
        <div class="modal-actions">
            <button class="btn secondary" type="button" id="cancel-message-modal">Cancelar</button>
            <button class="btn" type="submit" id="send-message-btn">Enviar</button>
        </div>
    </form>
</div>

<div id="tarea-modal" class="modal hidden">
    <form id="tarea-form" class="modal-card">
        <div class="modal-head">
            <h2 id="tarea-modal-title">Nueva tarea</h2>
            <button class="btn secondary small" type="button" id="close-tarea-modal">Cerrar</button>
        </div>
        <div class="form-grid">
            <div class="field full">
                <label>Título</label>
                <input name="titulo" type="text" required placeholder="Ej: Preparar overlay para el torneo">
            </div>
            <div class="field full">
                <label>Descripción</label>
                <textarea name="descripcion" placeholder="Detalles opcionales..."></textarea>
            </div>
            <div class="field">
                <label for="tarea-responsable-select">Responsable</label>
                <select name="responsable" id="tarea-responsable-select" aria-label="Responsable"></select>
            </div>
            <div class="field">
                <label for="tarea-estado-select">Estado</label>
                <select name="estado" id="tarea-estado-select" aria-label="Estado"></select>
            </div>
        </div>
        <div id="tarea-error" class="error"></div>
        <div class="modal-actions">
            <button class="btn danger small hidden" type="button" id="tarea-delete-btn">Eliminar</button>
            <button class="btn secondary" type="button" id="cancel-tarea-modal">Cancelar</button>
            <button class="btn" type="submit">Guardar</button>
        </div>
    </form>
</div>

<script type="module">

import {
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    onSnapshot,
    addDoc,

function profileRoles(data){
    if(!data) return [];
    return Array.isArray(data.roles) ? data.roles : (data.role ? [data.role] : []);
}

// El valor guardado en Firestore sigue siendo "editor" (evita migrar cuentas
// ya creadas); en toda la interfaz se muestra como "Staff".
const ROLE_DISPLAY_LABELS = { editor: "Staff" };
function roleLabel(role){
    return ROLE_DISPLAY_LABELS[role] || role;
}
function rolesLabel(roles){
    return roles.map(roleLabel).join(", ");
}

function hasValidRole(profile){
    return profile && profile.active !== false &&
        profileRoles(profile).some(role => ["admin", "editor", "capitan"].includes(role));
}

function isCapitan(){
    return profileRoles(currentProfile).includes("capitan");
}

function isStaff(){
    return profileRoles(currentProfile).some(role => ["admin", "editor"].includes(role));
}

function isAdmin(){
    return profileRoles(currentProfile).includes("admin");
}

async function loadProfile(user){
    const userRef = doc(db, "users", user.uid);
    const snapshot = await getDoc(userRef);

    if(snapshot.exists()){
        return snapshot.data();
    }

    return null;
}

function showLogin(){
    loginScreen.classList.remove("hidden");
    adminShell.classList.add("hidden");
}

function showAdmin(){
    loginScreen.classList.add("hidden");
    adminShell.classList.remove("hidden");
    userEmail.textContent = currentProfile.email || currentUser.email;
    roleBadge.textContent = rolesLabel(profileRoles(currentProfile)).toUpperCase();
    buildNav();

}

function visibleSectionKeys(){
    // Un capitán que ademas es staff (admin/editor) ve todo el nav igual que ellos.
    // Solo se acota cuando "capitan" es el unico rol relevante de la cuenta.
    if(isCapitan() && !isStaff()){
        const juego = currentProfile?.equipoJuego || "";
        const actividadKey = juego ? "actividad" + juego.charAt(0).toUpperCase() + juego.slice(1) : "";
        return ["dashboard", "comunicados", juego, actividadKey].filter(key => sections[key]);
    }
    return Object.keys(sections);
}

// Qué grupos del nav están colapsados queda guardado por navegador, no por
// cuenta (es solo una preferencia visual, no hace falta más que eso).
const NAV_COLLAPSE_KEY = "voranixAdminNavCollapsedGroups";

function getCollapsedGroups(){
    try{
        return new Set(JSON.parse(localStorage.getItem(NAV_COLLAPSE_KEY) || "[]"));
    }catch(error){
        return new Set();
    }
}

function setCollapsedGroups(set){
    localStorage.setItem(NAV_COLLAPSE_KEY, JSON.stringify(Array.from(set)));
}

function buildNav(){
    const keys = visibleSectionKeys();
    const allowed = new Set(keys);
    if(isAdmin()) allowed.add("users");

    const navButton = (key) => {
        const meta = NAV_META[key] || {};
        const label = key === "users" ? "Usuarios" : (meta.short || sections[key].label);
        return `<button type="button" data-section="${key}" class="${key === currentSection ? "active" : ""}"><span class="nav-icon">${meta.icon || "•"}</span>${label}</button>`;
    };

    const collapsed = getCollapsedGroups();

    nav.innerHTML = NAV_GROUPS.map(group => {
        const groupKeys = group.keys.filter(key => allowed.has(key));
        if(!groupKeys.length) return "";
        // El grupo que contiene la sección activa nunca queda colapsado, para
        // no esconder de golpe dónde estás parado.
        const hasActive = groupKeys.includes(currentSection);
        const isCollapsed = collapsed.has(group.label) && !hasActive;
        return `
<div class="nav-group${isCollapsed ? " collapsed" : ""}" data-nav-group="${group.label}">
    <button type="button" class="nav-group-label" data-nav-toggle>
        <span>${group.label}</span>
        <i class="nav-group-arrow">▾</i>
    </button>
    <div class="nav-group-items">${groupKeys.map(navButton).join("")}</div>
</div>`;
    }).join("");
}

function selectSection(key){
    const keys = visibleSectionKeys();
    if(key === "users"){
        if(!isAdmin()) key = keys[0] || "dashboard";
    }else if(!keys.includes(key)){
        key = keys[0] || "dashboard";
    }
    currentSection = key;
    buildNav();
    sidebar.classList.remove("open");
    if(unsubscribeList) unsubscribeList();
    if(key === "users") renderUsers();
    else if(key === "dashboard") renderDashboardSection();
    else if(key === "comunicados") renderComunicadosSection();
    else if(key === "tablero") renderTableroSection("ideas");
    else if(sections[key]?.singleton) renderOverlaySection();
    else renderCrudSection(sections[key]);
}

function getUsersFieldValue(data, name){
    if(name === "active") return data.active !== false;
    if(name === "roles") return profileRoles(data);
    return data[name] ?? "";
}

function assetUrl(path) {
    if (!path) return "";
    return /^https?:\/\//.test(path) || path.startsWith("/") ? path : "/" + path;
}

function tableValue(value, type, options){
    if(type === "image" || type === "imageurl") return value ? `<img src="${escapeHtml(assetUrl(value))}" alt="imagen">` : "-";
    if(type === "boolean") return value ? "Sí" : "No";
    if(type === "json") return Array.isArray(value) ? `${value.length} cupón(es)` : "-";
    if(type === "lineup") return Array.isArray(value) && value.length ? `${value.length} jugador(es)` : "-";
    if(type === "select" && Array.isArray(options)){
        const match = options.find(option => Array.isArray(option) ? option[0] === value : option === value);
        if(match) return escapeHtml(Array.isArray(match) ? match[1] : match);
    }
    if(!value) return "-";
    const text = escapeHtml(value);
    if(type === "textarea" || String(value).length > 60){
        return `<span class="cell-clamp" title="${text}">${text}</span>`;
    }
    return text;
}

function normalizeSearch(value){
    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

function getFilterFields(section){
    // Solo boolean, o select con mas de una opcion real (si hay 1 sola,
    // section.filterValue ya la fija y el filtro seria inutil).
    return section.fields.filter(field => {
        const [, , type, options] = field;
        if(type === "boolean") return true;
        if(type === "select"){
            const values = (options || []).map(o => Array.isArray(o) ? o[0] : o).filter(v => v !== "");
            return values.length > 1;
        }
        return false;
    });
}

function rowSearchText(section, data){
    const parts = section.fields.map(field => {
        const [name, , type, options] = field;
        const raw = data[name];
        if(type === "select" && Array.isArray(options)){
            const match = options.find(o => Array.isArray(o) ? o[0] === raw : o === raw);
            return match ? (Array.isArray(match) ? match[1] : match) : raw;
        }
        if(type === "boolean") return raw ? "si activo" : "no inactivo";
        return raw;
    });
    parts.push(data.id);
    return normalizeSearch(parts.join(" "));
}

function toolbarHtml(section, searchId, placeholder){
    const filters = getFilterFields(section);
    const filterSelects = filters.map(field => {
        const [name, label, type, options] = field;
        const opts = type === "boolean"
            ? [["", "Todos"], ["true", "Sí"], ["false", "No"]]
            : [["", "Todos"]].concat((options || []).map(o => Array.isArray(o) ? o : [o, o]).filter(([value]) => value !== ""));
        return `<select data-filter="${name}">${opts.map(([value, optLabel]) => `<option value="${escapeHtml(value)}">${escapeHtml(label)}: ${escapeHtml(optLabel)}</option>`).join("")}</select>`;
    }).join("");
    return `
<div class="table-toolbar">
    <input type="search" id="${searchId}" placeholder="${escapeHtml(placeholder)}" autocomplete="off">
    ${filterSelects}
    <span class="count" id="${searchId}-count"></span>
</div>`;
}

    const searchInput = document.getElementById("item-search");

    const selectAllBox = document.getElementById("select-all");
    const bulkBar = document.getElementById("bulk-bar");
    const bulkCount = document.getElementById("bulk-count");
    const bulkDeleteBtn = document.getElementById("bulk-delete-btn");

    let currentDocs = [];
    const selected = new Set();

    function updateBulkBar(){
        bulkBar.classList.toggle("hidden", selected.size === 0);
        bulkCount.textContent = `${selected.size} seleccionado(s)`;
        const idsOnScreen = Array.from(body.querySelectorAll("[data-select]")).map(cb => cb.dataset.select);
        const selectedOnScreen = idsOnScreen.filter(id => selected.has(id));
        selectAllBox.checked = idsOnScreen.length > 0 && selectedOnScreen.length === idsOnScreen.length;
        selectAllBox.indeterminate = selectedOnScreen.length > 0 && selectedOnScreen.length < idsOnScreen.length;
    }

    function renderFilteredRows(){
        const term = normalizeSearch(searchInput.value.trim());
        const activeFilters = filterSelects
            .map(select => [select.dataset.filter, select.value])
            .filter(([, value]) => value !== "");

        const filtered = currentDocs.filter(item => {
            if(term && !rowSearchText(section, item).includes(term)) return false;
            return activeFilters.every(([name, value]) => {
                const field = section.fields.find(f => f[0] === name);
                const raw = item[name];
                if(field[2] === "boolean") return String(!!raw) === value;
                return String(raw ?? "") === value;
            });
        });

        const currentIds = new Set(currentDocs.map(item => item.id));
        Array.from(selected).forEach(id => { if(!currentIds.has(id)) selected.delete(id); });

        const rows = filtered.map(item => {
            const data = item;
            return `<tr>
<td class="select-col"><input type="checkbox" data-select="${item.id}" ${selected.has(item.id) ? "checked" : ""}></td>
${section.fields.map(field => `<td>${tableValue(data[field[0]], field[2], field[3])}</td>`).join("")}
<td><div class="actions">
    <button class="btn secondary small" type="button" data-edit="${item.id}">Editar</button>
    <button class="btn danger small" type="button" data-delete="${item.id}">Eliminar</button>
</div></td>
</tr>`;
        });
        body.innerHTML = rows.length ? rows.join("") : `<tr><td colspan="${section.fields.length + 2}" class="empty">Sin resultados.</td></tr>`;
        countLabel.textContent = `${filtered.length} de ${currentDocs.length}`;
        updateBulkBar();
    }

    searchInput.addEventListener("input", renderFilteredRows);
    filterSelects.forEach(select => select.addEventListener("change", renderFilteredRows));

    body.addEventListener("change", (event) => {
        const checkbox = event.target.closest("[data-select]");
        if(!checkbox) return;
        if(checkbox.checked) selected.add(checkbox.dataset.select);
        else selected.delete(checkbox.dataset.select);
        updateBulkBar();
    });

    selectAllBox.addEventListener("change", () => {
        const idsOnScreen = Array.from(body.querySelectorAll("[data-select]")).map(cb => cb.dataset.select);
        if(selectAllBox.checked) idsOnScreen.forEach(id => selected.add(id));
        else idsOnScreen.forEach(id => selected.delete(id));
        renderFilteredRows();
    });

    bulkDeleteBtn.addEventListener("click", async () => {
        const ids = Array.from(selected);
        if(!ids.length) return;
        if(!confirmBulkDelete(ids.length)) return;
        try{
            for(const id of ids){
                await deleteDoc(doc(db, section.collection, id));
                if(currentSection === "accesos") await deleteDoc(doc(db, "proyectos", id)).catch(() => {});
            }
            selected.clear();
        }catch(error){
            console.error(error);
            alert("No se pudo completar la eliminación masiva.");
        }
    });

    unsubscribeList = onSnapshot(collection(db, section.collection), (snapshot) => {
        const docs = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
        console.log(section.collection, docs.map(d => d));
        currentDocs = section.filterValue
            ? docs.filter(item => String(item.juego || "").toLowerCase() === section.filterValue)
            : docs;
        renderFilteredRows();
    }, (error) => {
        console.error(error);
        body.innerHTML = `<tr><td colspan="${section.fields.length + 2}" class="empty">No se pudieron cargar los datos.</td></tr>`;
    });
}

const JUEGO_DASH_LABELS = { valorant: "Valorant A", valorantsecundario: "Valorant B", fifa: "FIFA", dbd: "DBD" };

function relativeTime(timestamp){
    if(!timestamp || typeof timestamp.toDate !== "function") return "";
    return relativeTimeFromDate(timestamp.toDate());
}

// Igual que relativeTime pero para fechas planas (Date o string ISO), como
// las que devuelve Firebase Auth (lastSignInTime/creationTime), que no son
// Timestamps de Firestore.
function relativeTimeFromDate(dateInput){
    if(!dateInput) return "";
    const date = dateInput instanceof Date ? dateInput : new Date(dateInput);
    if(Number.isNaN(date.getTime())) return "";
    const diffMin = Math.round((Date.now() - date.getTime()) / 60000);
    if(diffMin < 1) return "recién";
    if(diffMin < 60) return `hace ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if(diffH < 24) return `hace ${diffH} h`;
    const diffD = Math.round(diffH / 24);
    if(diffD < 30) return `hace ${diffD} d`;
    return date.toLocaleDateString("es-CL", { day: "2-digit", month: "short", year: "numeric" });
}

// Misma lógica de parseo que roster-activity.js, para ordenar próximos eventos.
function parseActividadDate(item){
    const dateStr = item.fechaInicio || item.fechaFin;
    if(!dateStr) return null;
    const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateStr);
    if(!match) return null;
    let hours = 0, minutes = 0;
    if(item.hora){
        const horaMatch = /^(\d{2}):(\d{2})/.exec(item.hora);
        if(horaMatch){ hours = Number(horaMatch[1]); minutes = Number(horaMatch[2]); }
    }
    return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), hours, minutes);
}

async function loadComunicadosContacts(){
    const usersSnap = await getDocs(collection(db, "users"));
    const users = usersSnap.docs
        .map(d => {
            const data = d.data();
            const roles = profileRoles(data);
            return {
                type: "uid", id: d.id,
                nombre: data.displayName || data.email || d.id,
                email: data.email || "",
                roles, equipoJuego: data.equipoJuego || "",
                tag: rolesLabel(roles) || "Sin rol",
                active: data.active !== false
            };
        })
        .filter(c => c.active);

    let contacts = users;

    if(isStaff()){
        const [streamersSnap, influencersSnap] = await Promise.all([
            getDocs(collection(db, "streamers")),
            getDocs(collection(db, "influencers"))
        ]);
        const streamers = streamersSnap.docs.map(d => d.data())
            .filter(s => s.email && s.activo !== false)
            .map(s => ({ type: "contact", id: s.email, nombre: s.nombre || s.email, email: s.email, roles: [], equipoJuego: "", tag: "Streamer" }));
        const influencers = influencersSnap.docs.map(d => d.data())
            .filter(i => i.email && i.activo !== false)
            .map(i => ({ type: "contact", id: i.email, nombre: i.nombre || i.email, email: i.email, roles: [], equipoJuego: "", tag: "Influencer" }));
        contacts = contacts.concat(streamers, influencers);
    }

    return contacts;
}

async function handleComunicadosSubmit(event, errorEl){
    event.preventDefault();
    errorEl.textContent = "";

    if(!comunicadosSelected.size){
        errorEl.textContent = "Selecciona al menos un destinatario.";
        return;
    }

    const formData = new FormData(event.target);
    const asunto = String(formData.get("asunto") || "").trim();
    const mensaje = String(formData.get("mensaje") || "").trim();
    if(!asunto || !mensaje){
        errorEl.textContent = "Completa el asunto y el mensaje.";
        return;
    }

    const selectedContacts = comunicadosContacts.filter(c => comunicadosSelected.has(comunicadosKey(c)));
    const uids = selectedContacts.filter(c => c.type === "uid").map(c => c.id);
    const contactos = selectedContacts.filter(c => c.type === "contact").map(c => ({ email: c.email, nombre: c.nombre }));

    const label = selectedContacts.length === 1 ? "1 destinatario" : `${selectedContacts.length} destinatarios`;
    if(!confirm(`¿Enviar este mensaje a ${label}?`)) return;

    const submitBtn = event.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try{
        const resultados = [];
        if(uids.length){
            const fn = httpsCallable(functionsInstance, "enviarComunicado");
            const r = await fn({ uids, asunto, mensaje });
            resultados.push(...(r.data.detalle || []));
        }
        if(contactos.length){
            const fn2 = httpsCallable(functionsInstance, "enviarComunicadoContacto");
            const r2 = await fn2({ contactos, asunto, mensaje });
            resultados.push(...(r2.data.detalle || []));
        }
        const ok = resultados.filter(d => d.status === "enviado").length;
        const fail = resultados.filter(d => d.status !== "enviado");
        let msg = `Enviados: ${ok}/${resultados.length}.`;
        if(fail.length) msg += `\nFallaron: ${fail.map(f => `${f.uid} (${f.error})`).join(", ")}`;
        alert(msg);
        comunicadosSelected.clear();
        selectSection("comunicados");
    }catch(error){
        console.error(error);
        errorEl.textContent = "No se pudo enviar: " + (error.message || error);
    }finally{
        submitBtn.disabled = false;
    }
}

const BULK_DELETE_PASSWORD = "VoranixADMIN";

function confirmBulkDelete(count){
    if(count <= 1) return confirm("¿Eliminar este registro?");
    const pass = prompt(`Vas a eliminar ${count} registros a la vez. Escribe la contraseña de administrador para confirmar:`);
    if(pass === null) return false;
    if(pass !== BULK_DELETE_PASSWORD){
        alert("Contraseña incorrecta. No se eliminó nada.");
        return false;
    }
    return true;
}

async function enviarAcceso(uids){
    if(!uids.length) return;
    const label = uids.length === 1 ? "este creador" : `estos ${uids.length} creadores`;
    if(!confirm(`¿Enviar correo de acceso a ${label}? Les vamos a mandar un link para configurar su contraseña.`)) return;

    try{
        const sendFn = httpsCallable(functionsInstance, "enviarAccesoCreador");
        const result = await sendFn({ uids });
        const detalle = result.data.detalle || [];
        const ok = detalle.filter(d => d.status === "enviado").length;
        const fail = detalle.filter(d => d.status !== "enviado");
        let msg = `Enviados: ${ok}/${detalle.length}.`;
        if(fail.length) msg += `\nFallaron: ${fail.map(f => `${f.uid} (${f.error})`).join(", ")}`;
        alert(msg);
    }catch(error){
        console.error(error);
        alert("No se pudo enviar: " + (error.message || error));
    }
}

        const selectedOnScreen = idsOnScreen.filter(id => selected.has(id));
        selectAllBox.checked = idsOnScreen.length > 0 && selectedOnScreen.length === idsOnScreen.length;
        selectAllBox.indeterminate = selectedOnScreen.length > 0 && selectedOnScreen.length < idsOnScreen.length;
    }

    function renderFilteredUsers(){
        const term = normalizeSearch(searchInput.value.trim());
        const role = roleFilter.value;
        const activeValue = activeFilter.value;

        const filtered = usersCache.filter(user => {
            if(term){
                const haystack = normalizeSearch(`${user.displayName || ""} ${user.email || ""}`);
                if(!haystack.includes(term)) return false;
            }
            if(role && !profileRoles(user).includes(role)) return false;
            if(activeValue && String(user.active !== false) !== activeValue) return false;
            return true;
        });

        const currentUids = new Set(usersCache.map(user => user.uid));
        Array.from(selected).forEach(uid => { if(!currentUids.has(uid)) selected.delete(uid); });

        const rows = filtered.map(user => {
            const acceso = lastAccessCache[user.uid];
            const ultimoIngreso = acceso?.lastSignInTime
                ? `<span title="${escapeHtml(new Date(acceso.lastSignInTime).toLocaleString("es-CL"))}">${escapeHtml(relativeTimeFromDate(acceso.lastSignInTime))}</span>`
                : (acceso ? `<span class="muted">Nunca</span>` : `<span class="muted">…</span>`);
            return `
<tr>
<td class="select-col"><input type="checkbox" data-select="${user.uid}" ${selected.has(user.uid) ? "checked" : ""}></td>
<td>${user.displayName ? escapeHtml(user.displayName) : "-"}</td>
<td>${user.email ? escapeHtml(user.email) : "-"}</td>
<td>${profileRoles(user).length ? escapeHtml(rolesLabel(profileRoles(user))) : "-"}</td>
<td>${user.active === false ? "No" : "Sí"}</td>
<td>${ultimoIngreso}</td>
<td><div class="actions">
    <button class="btn secondary small" type="button" data-user-edit="${user.uid}">Editar</button>
    ${profileRoles(user).some(r => ["creador", "capitan", "jugador"].includes(r)) ? `<button class="btn small" type="button" data-send-access="${user.uid}">Enviar acceso</button>` : ""}
</div></td>
</tr>`;
        });

        body.innerHTML = rows.length ? rows.join("") : `<tr><td colspan="7" class="empty">Sin resultados.</td></tr>`;
        countLabel.textContent = `${filtered.length} de ${usersCache.length}`;
        updateBulkBar();
    }

    searchInput.addEventListener("input", renderFilteredUsers);
    roleFilter.addEventListener("change", renderFilteredUsers);
    activeFilter.addEventListener("change", renderFilteredUsers);

    body.addEventListener("change", (event) => {
        const checkbox = event.target.closest("[data-select]");
        if(!checkbox) return;
        if(checkbox.checked) selected.add(checkbox.dataset.select);
        else selected.delete(checkbox.dataset.select);
        updateBulkBar();
    });

    selectAllBox.addEventListener("change", () => {
        const idsOnScreen = Array.from(body.querySelectorAll("[data-select]")).map(cb => cb.dataset.select);
        if(selectAllBox.checked) idsOnScreen.forEach(id => selected.add(id));
        else idsOnScreen.forEach(id => selected.delete(id));
        renderFilteredUsers();
    });

    bulkMessageBtn.addEventListener("click", () => {
        if(!selected.size){
            alert("Selecciona al menos una cuenta para enviarle un mensaje.");
            return;
        }
        openMessageModal(Array.from(selected));
    });

    bulkSendAccessBtn.addEventListener("click", () => {
        const uids = Array.from(selected).filter(uid => {
            const user = usersCache.find(u => u.uid === uid);
            return user && profileRoles(user).some(r => ["creador", "capitan", "jugador"].includes(r));
        });
        if(!uids.length){
            alert("Selecciona al menos una cuenta creador, capitán o jugador para enviar el acceso.");
            return;
        }
        enviarAcceso(uids);
    });

    bulkDeleteBtn.addEventListener("click", async () => {
        const uids = Array.from(selected);
        if(!uids.length) return;
        if(!confirmBulkDelete(uids.length)) return;
        try{
            for(const uid of uids){
                await deleteDoc(doc(db, "users", uid));
            }
            selected.clear();
            await renderUsers();
        }catch(error){
            console.error(error);
            alert("No se pudo completar la eliminación masiva.");
        }
    });

    try{
        const snapshot = await getDocs(collection(db, "users"));
        usersCache = snapshot.docs.map(item => ({ uid: item.id, ...item.data() }));
        renderFilteredUsers();
    }catch(error){
        console.error(error);
        body.innerHTML = `<tr><td colspan="7" class="empty">No se pudieron cargar los usuarios.</td></tr>`;
        return;
    }

    // El último ingreso vive solo en Firebase Auth (no en Firestore), asi que
    // se pide aparte via Cloud Function y se repinta la tabla al llegar.
    try{
        const obtenerUltimoAcceso = httpsCallable(functionsInstance, "obtenerUltimoAcceso");
        const result = await obtenerUltimoAcceso({ uids: usersCache.map(u => u.uid) });
        (result.data.estados || []).forEach(estado => { lastAccessCache[estado.uid] = estado; });
        renderFilteredUsers();
    }catch(error){
        console.error("No se pudo obtener el último ingreso:", error);
    }
}

function fieldHtml(field, value){
    // El modal se arma desde la definicion de campos para evitar duplicar formularios.
    const [name, label, type, options] = field;
    const safeValue = value ?? "";
    const full = ["textarea", "json", "image", "lineup"].includes(type) ? " full" : "";

    if(type === "textarea"){
        return `<div class="field${full}"><label>${label}</label><textarea name="${name}">${escapeHtml(safeValue)}</textarea></div>`;
    }

    if(type === "json"){
        const jsonValue = Array.isArray(value) ? JSON.stringify(value, null, 2) : "[]";
        return `<div class="field${full}"><label>${label}</label><textarea name="${name}">${jsonValue}</textarea><span class="help">Formato: [{"titulo":"...","descripcion":"...","codigo":"..."}]</span></div>`;
    }

    if(type === "select"){
        const opts = options.map(option => Array.isArray(option) ? option : [option, option]);
        return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(([optValue, optLabel]) => `<option value="${optValue}" ${optValue === safeValue ? "selected" : ""}>${optLabel}</option>`).join("")}</select></div>`;
    }

    if(type === "boolean"){
        return `<div class="field"><label>${label}</label><select name="${name}"><option value="false" ${!safeValue ? "selected" : ""}>No</option><option value="true" ${safeValue ? "selected" : ""}>Sí</option></select></div>`;
    }

    if(type === "image"){
        const preview = safeValue ? `<img src="${escapeHtml(assetUrl(safeValue))}" alt="${label}" style="width:100%;max-width:220px;height:120px;object-fit:cover;border-radius:6px;border:1px solid #33334a;margin-top:10px;">` : "";
        return `<div class="field${full}"><label>${label}</label><div style="display:flex;gap:8px;align-items:center;"><input name="${name}" type="text" value="${escapeHtml(safeValue)}" placeholder="Ruta o URL de imagen" style="flex:1;"><button type="button" class="btn danger small" title="Eliminar imagen" onclick="this.closest('div').querySelector('input[type=text]').value=''; this.closest('.field').querySelector('input[type=file]').value='';">🗑️</button></div><input name="${name}File" type="file" accept="image/*"><span class="help">Puedes pegar una ruta relativa, una URL o subir una imagen a Firebase Storage.</span>${preview}</div>`;
    }

    if(type === "imageurl"){
        return `<div class="field"><label>${label}</label><div style="display:flex;gap:8px;align-items:center;"><input name="${name}" type="text" value="${escapeHtml(safeValue)}" placeholder="URL de la imagen" style="flex:1;"><button type="button" class="btn danger small" title="Eliminar imagen" onclick="this.closest('div').querySelector('input[type=text]').value=''; this.closest('.field').querySelector('input[type=file]').value='';">🗑️</button></div><input name="${name}File" type="file" accept="image/*" style="margin-top:6px;font-size:11px;"><span class="help">Pegá una URL o subí un archivo pequeño desde tu dispositivo.</span></div>`;
    }

    if(type === "lineup"){
        return `<div class="field${full}" data-lineup-field="${name}"><label>${label}</label><div class="lineup-rows" data-lineup-rows></div><button type="button" class="btn secondary small" data-lineup-add>+ Agregar jugador</button><span class="help">Selecciona quiénes jugaron y con qué agente. Toca 👑 para marcar al MVP de la partida. Esto alimenta las estadísticas de cada jugador en el Portal Roster.</span></div>`;
    }

    return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${escapeHtml(safeValue)}"></div>`;
}

async function fetchValorantRosterNames(rosterJuego){
    if(valorantRosterNamesCache[rosterJuego]) return valorantRosterNamesCache[rosterJuego];
    const snapshot = await getDocs(query(collection(db, "rosters"), where("juego", "==", rosterJuego)));
    const names = snapshot.docs
        .map(d => d.data())
        .filter(item => item.activo !== false && item.nombre)
        .map(item => item.nombre)
        .sort((a, b) => String(a).localeCompare(String(b)));
    valorantRosterNamesCache[rosterJuego] = names;
    return names;
}

// Dropdown propio (no <select> nativo) para que el desplegable siempre se
// abra hacia abajo, sin importar cuántas opciones tenga ni el scroll del modal.
let openLineupPanel = null;

function closeLineupPanel(){
    if(openLineupPanel){
        openLineupPanel.panel.remove();
        openLineupPanel.wrap.classList.remove("open");
        openLineupPanel = null;
    }
}

document.addEventListener("click", closeLineupPanel);
document.addEventListener("scroll", (event) => {
    // No cerrar si el scroll ocurre dentro del propio panel (el usuario viendo más opciones).
    if(openLineupPanel && openLineupPanel.panel.contains(event.target)) return;
    closeLineupPanel();
}, true);
window.addEventListener("resize", closeLineupPanel);

function createLineupSelect(name, options, selectedValue, placeholderLabel){
    const wrap = document.createElement("div");
    wrap.className = "lineup-select";

    const hidden = document.createElement("input");
    hidden.type = "hidden";
    hidden.name = name;
    hidden.value = selectedValue || "";

    const trigger = document.createElement("button");
    trigger.type = "button";
    trigger.className = "lineup-select-trigger";

    function setLabel(value){
        trigger.innerHTML = `<span class="${value ? "" : "placeholder"}">${escapeHtml(value || placeholderLabel)}</span><span class="arrow">▾</span>`;
    }

    function choose(value){
        hidden.value = value;
        setLabel(value);
        closeLineupPanel();
    }

    function openPanel(){
        closeLineupPanel();
        const panel = document.createElement("div");
        panel.className = "lineup-select-panel";

        const placeholderOpt = document.createElement("div");
        placeholderOpt.className = "lineup-select-option placeholder";
        placeholderOpt.textContent = placeholderLabel;
        placeholderOpt.addEventListener("click", (event) => { event.stopPropagation(); choose(""); });
        panel.appendChild(placeholderOpt);

        options.forEach(option => {
            const optionEl = document.createElement("div");
            optionEl.className = "lineup-select-option" + (option === hidden.value ? " active" : "");
            optionEl.textContent = option;
            optionEl.addEventListener("click", (event) => { event.stopPropagation(); choose(option); });
            panel.appendChild(optionEl);
        });

        document.body.appendChild(panel);
        const rect = trigger.getBoundingClientRect();
        const spaceBelow = window.innerHeight - rect.bottom - 12;
        panel.style.left = `${rect.left}px`;
        panel.style.top = `${rect.bottom + 4}px`;
        panel.style.width = `${rect.width}px`;
        panel.style.maxHeight = `${Math.max(120, Math.min(260, spaceBelow))}px`;

        wrap.classList.add("open");
        openLineupPanel = { panel, wrap };
    }

    trigger.addEventListener("click", (event) => {
        event.stopPropagation();
        if(openLineupPanel && openLineupPanel.wrap === wrap){
            closeLineupPanel();
        }else{
            openPanel();
        }
    });

    setLabel(selectedValue);
    wrap.appendChild(hidden);
    wrap.appendChild(trigger);
    return wrap;
}

// Segunda columna del line-up por juego: Valorant elige agente de una lista
// fija, FIFA elige posición (mismos valores que el rol de jugador), y DBD
// queda en texto libre porque el universo de personajes es demasiado grande
// para curar una lista.
const LINEUP_SECOND_FIELD = {
    valorant: { label: "Selecciona agente", options: VALORANT_AGENTS, freeText: false },
    valorantsecundario: { label: "Selecciona agente", options: VALORANT_AGENTS, freeText: false },
    fifa: { label: "Selecciona posición", options: FIFA_ROLES.filter(([value]) => value).map(([, label]) => label), freeText: false },
    dbd: { label: "Personaje jugado", options: [], freeText: true }
};

async function initLineupField(fieldName, existingRows, rosterJuego){
    const container = formFields.querySelector(`[data-lineup-field="${fieldName}"]`);
    if(!container) return;
    const rowsWrap = container.querySelector("[data-lineup-rows]");
    const addBtn = container.querySelector("[data-lineup-add]");
    delete valorantRosterNamesCache[rosterJuego]; // recargar por si se agregaron/editaron jugadores
    const players = await fetchValorantRosterNames(rosterJuego);
    const secondField = LINEUP_SECOND_FIELD[rosterJuego] || LINEUP_SECOND_FIELD.valorant;

    function addRow(jugador = "", agente = "", mvp = false){
        const row = document.createElement("div");
        row.className = "lineup-row" + (mvp ? " is-mvp" : "");
        row.style.cssText = "display:flex;gap:8px;margin-bottom:8px;align-items:center;";

        row.appendChild(createLineupSelect(`${fieldName}_jugador`, players, jugador, "Selecciona jugador"));

        if(secondField.freeText){
            const input = document.createElement("input");
            input.type = "text";
            input.name = `${fieldName}_agente`;
            input.value = agente;
            input.placeholder = secondField.label;
            input.style.cssText = "flex:1;min-width:0;background:#07070d;color:#fff;border:1px solid #272738;border-radius:6px;padding:12px;";
            row.appendChild(input);
        }else{
            // Si el valor guardado no está en la lista (dato nuevo), se agrega igual para no perderlo.
            const agentOptions = agente && !secondField.options.includes(agente) ? [agente, ...secondField.options] : secondField.options;
            row.appendChild(createLineupSelect(`${fieldName}_agente`, agentOptions, agente, secondField.label));
        }

        const mvpInput = document.createElement("input");
        mvpInput.type = "hidden";
        mvpInput.name = `${fieldName}_mvp`;
        mvpInput.value = mvp ? "true" : "false";
        row.appendChild(mvpInput);

        const mvpBtn = document.createElement("button");
        mvpBtn.type = "button";
        mvpBtn.className = "btn lineup-mvp-btn" + (mvp ? " active" : "");
        mvpBtn.title = "Marcar como MVP de la partida";
        mvpBtn.textContent = "👑";
        mvpBtn.addEventListener("click", () => {
            const makeMvp = mvpInput.value !== "true";
            rowsWrap.querySelectorAll(".lineup-row").forEach(otherRow => {
                otherRow.classList.remove("is-mvp");
                otherRow.querySelector(`input[name="${fieldName}_mvp"]`).value = "false";
                otherRow.querySelector(".lineup-mvp-btn").classList.remove("active");
            });
            if(makeMvp){
                mvpInput.value = "true";
                row.classList.add("is-mvp");
                mvpBtn.classList.add("active");
            }
        });
        row.appendChild(mvpBtn);

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "btn danger small";
        removeBtn.textContent = "✕";
        removeBtn.addEventListener("click", () => row.remove());
        row.appendChild(removeBtn);

        rowsWrap.appendChild(row);
    }

    rowsWrap.innerHTML = "";
    if(Array.isArray(existingRows) && existingRows.length){
        existingRows.forEach(item => addRow(item.jugador || "", item.agente || "", !!item.mvp));
    }else{
        addRow();
    }

    addBtn.addEventListener("click", () => addRow());
}

async function uploadImage(file, bucketPath, fieldName){
    const fileName = `${Date.now()}-${file.name}`.replace(/\s+/g, "_");
    const storageRef = ref(storage, `${bucketPath}/${fieldName}/${fileName}`);
    const snapshot = await uploadBytes(storageRef, file);
    return await getDownloadURL(snapshot.ref);
}

async function syncAccesoToProyectos(id, payload){
    // Un acceso/evento con "Activo en Proyectos" también se refleja como
    // proyecto (mismo id de documento, para poder mantenerlos sincronizados).
    const proyectoRef = doc(db, "proyectos", id);
    if(payload.publicarProyectos){
        await setDoc(proyectoRef, {
            titulo: payload.titulo || "",
            fecha: payload.fechaLimite || "",
            descripcion: payload.descripcion || "",
            textoLargo: payload.requisitos || "",
            img: payload.imagen || "",
            link: payload.link || "",
            upcoming: true,
            origenAcceso: true,
            updatedAt: serverTimestamp()
        }, { merge: true });
    }else{
        await deleteDoc(proyectoRef).catch(() => {});
    }
}

async function saveItem(event){
    event.preventDefault();
    const formData = new FormData(itemForm);
    const payload = {};
    showError(formError, "");

    try{
        if(currentSection === "users"){
            payload.displayName = formData.get("displayName") || "";
            payload.roles = formData.getAll("roles");
            payload.equipoJuego = formData.get("equipoJuego") || "";
            payload.active = formData.get("active") === "on";

            if(editingId){
                await updateDoc(doc(db, "users", editingId), payload);
            }else{
                const uid = String(formData.get("uid") || "").trim();
                const email = String(formData.get("email") || "").trim();
                if(!uid){
                    showError(formError, "Debes indicar el UID (cópialo desde Firebase Console → Authentication).");
                    return;
                }
                payload.email = email;
                payload.createdAt = serverTimestamp();
                await setDoc(doc(db, "users", uid), payload);
            }
            closeModal();
            await renderUsers();
            return;
        }

        const section = sections[currentSection];
        for(const field of section.fields){
            const [name, , type] = field;
            const file = formData.get(`${name}File`);
            const urlValue = String(formData.get(name) ?? "").trim();
            const currentValue = editingData[name];

            if((type === "image" || type === "imageurl") && file && file.size){
                payload[name] = await uploadImage(file, section.collection, name);
            }else if(type === "image"){
                if(urlValue){
                    payload[name] = urlValue;
                }else if(editingId && currentValue){
                    payload[name] = currentValue;
                }
            }else if(type === "json"){
                const raw = formData.get(name) || "[]";
                payload[name] = JSON.parse(raw);
            }else if(type === "lineup"){
                const jugadores = formData.getAll(`${name}_jugador`);
                const agentes = formData.getAll(`${name}_agente`);
                const mvps = formData.getAll(`${name}_mvp`);
                payload[name] = jugadores
                    .map((jugador, i) => ({
                        jugador: String(jugador || "").trim(),
                        agente: String(agentes[i] || "").trim(),
                        mvp: mvps[i] === "true"
                    }))
                    .filter(row => row.jugador || row.agente);
            }else if(type === "boolean"){
                payload[name] = formData.get(name) === "true";
            }else{
                payload[name] = formData.get(name) || "";
            }
        }

        payload.updatedAt = serverTimestamp();

        let savedId = editingId;
        if(editingId){
            await updateDoc(doc(db, section.collection, editingId), payload);
        }else{
            payload.createdAt = serverTimestamp();
            const created = await addDoc(collection(db, section.collection), payload);
            savedId = created.id;
        }

        if(currentSection === "accesos"){
            await syncAccesoToProyectos(savedId, payload);
        }

        closeModal();
    }catch(error){
        console.error(error);
        showError(formError, "No se pudo guardar. Revisa los campos y permisos.");
    }
}

nav.addEventListener("click", (event) => {
    const toggle = event.target.closest("[data-nav-toggle]");
    if(toggle){
        const groupEl = toggle.closest("[data-nav-group]");
        const label = groupEl.dataset.navGroup;
        const collapsed = getCollapsedGroups();
        if(collapsed.has(label)) collapsed.delete(label);
        else collapsed.add(label);
        setCollapsedGroups(collapsed);
        groupEl.classList.toggle("collapsed");
        return;
    }
    const button = event.target.closest("[data-section]");
    if(button) selectSection(button.dataset.section);
});

content.addEventListener("click", async (event) => {
    const editButton = event.target.closest("[data-edit]");
    const userEditButton = event.target.closest("[data-user-edit]");
    const deleteButton = event.target.closest("[data-delete]");
    const roleButton = event.target.closest("[data-role]");
    const disableButton = event.target.closest("[data-disable]");
    const sendAccessButton = event.target.closest("[data-send-access]");
    const gotoSectionButton = event.target.closest("[data-goto-section]");
    const tableroTabButton = event.target.closest("[data-tablero-tab]");

    try{
        if(gotoSectionButton){
            selectSection(gotoSectionButton.dataset.gotoSection);
            return;
        }

        if(tableroTabButton){
            renderTableroSection(tableroTabButton.dataset.tableroTab);
            return;
        }

        if(userEditButton){
            const user = usersCache.find(item => item.uid === userEditButton.dataset.userEdit);
            if(user) openItemModal(user.uid, user);
        }

        if(sendAccessButton){
            await enviarAcceso([sendAccessButton.dataset.sendAccess]);
        }

        if(editButton){
            const section = sections[currentSection];
            const snapshot = await getDoc(doc(db, section.collection, editButton.dataset.edit));
            if(snapshot.exists()) openItemModal(snapshot.id, snapshot.data());
        }

        if(deleteButton && confirm("¿Eliminar este registro?")){
            const section = sections[currentSection];
            await deleteDoc(doc(db, section.collection, deleteButton.dataset.delete));
            if(currentSection === "accesos"){
                await deleteDoc(doc(db, "proyectos", deleteButton.dataset.delete)).catch(() => {});
            }
        }

        if(roleButton){
            await updateDoc(doc(db, "users", roleButton.dataset.role), { role: roleButton.dataset.nextRole, updatedAt: serverTimestamp() });
        }

        if(disableButton && confirm("¿Desactivar este usuario?")){
            await updateDoc(doc(db, "users", disableButton.dataset.disable), { active: false, updatedAt: serverTimestamp() });
            await renderUsers();
        }
    }catch(error){
        console.error(error);
        alert("No se pudo completar la operación. Revisa permisos o conexión.");
    }
});

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    showError(loginError, "");

    try{
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        await signInWithEmailAndPassword(auth, email, password);
    }catch(error){
        console.error(error);
        showError(loginError, "Email o contraseña incorrectos.");
    }
});

document.querySelectorAll("[data-logout]").forEach(button => {

document.getElementById("hamburger").addEventListener("click", () => sidebar.classList.toggle("open"));

const sidebarCollapseBtn = document.getElementById("sidebar-collapse");
const SIDEBAR_COLLAPSE_KEY = "voranixAdminSidebarCollapsed";
function applySidebarCollapsed(collapsed){

}

onAuthStateChanged(auth, async (user) => {
    // Firebase recuerda la sesion; si ya esta logueado se muestra el dashboard.
    currentUser = user;

    if(!user){
        currentProfile = null;
        if(unsubscribeList) unsubscribeList();
        showLogin();
        return;
    }

    try{
        currentProfile = await loadProfile(user);

        if(!hasValidRole(currentProfile)){
            showError(loginError, "Tu cuenta no tiene permisos de administración.");
            await signOut(auth);
            return;
        }

        showAdmin();
    }catch(error){
        console.error("ERROR LOGIN:");
        console.error(error);
        alert(
            "Código: " + error.code +
            "\nMensaje: " + error.message
        );

        showError(loginError, error.message);
        await signOut(auth);
    }
});
</script>
