<script>
const toggle = document.getElementById("menu-toggle");
const navbar = document.querySelector(".navbar");
toggle.addEventListener("click", () => navbar.classList.toggle("active"));
</script>

<script type="module">
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { db, escapeHtml } from "/assets/js/firebase-config.js";

const container = document.getElementById("sponsors-page");

function assetUrl(path) {
    if (!path) return "";
    return /^https?:\/\//.test(path) || path.startsWith("/") ? path : "/" + path;
}

function renderSponsor(sponsor){
    return `
<div class="sponsor-box ${sponsor.tipo === "patrocinador" ? "sponsor-main" : ""}" id="${sponsor.id}">
    <img src="${assetUrl(sponsor.logo) || "/imagenes/logo.jpg"}" alt="${escapeHtml(sponsor.nombre) || "Patrocinador"}">
    <div class="sponsor-info">
        <h2>${escapeHtml(sponsor.nombre) || "Patrocinador"}</h2>
        <p>${escapeHtml(sponsor.descripcion) || ""}</p>
        ${/^https?:\/\//.test(sponsor.web || "") ? `<div class="sponsor-links"><a href="${escapeHtml(sponsor.web)}" target="_blank" rel="noopener" class="btn">Ir al sitio</a></div>` : ""}
    </div>
</div>`;
}

async function loadSponsors(){
    try{
        const snapshot = await getDocs(collection(db, "sponsors"));
        const sponsors = snapshot.docs
            .map(doc => ({ id: doc.id, ...doc.data() }))
            .filter(item => item.activo !== false)
            .sort((a, b) => {
                const aMain = a.tipo === "patrocinador" ? 0 : 1;
                const bMain = b.tipo === "patrocinador" ? 0 : 1;
                if (aMain !== bMain) return aMain - bMain;
                return String(a.nombre || "").localeCompare(String(b.nombre || ""));
            });
        container.innerHTML = sponsors.length
            ? sponsors.map(renderSponsor).join("")
            : `<p class="loading">Aun no hay patrocinadores publicados.</p>`;
    }catch(error){
        console.error(error);
        container.innerHTML = `<p class="loading">No se pudieron cargar los patrocinadores.</p>`;
    }
}

loadSponsors();
</script>
</body>
